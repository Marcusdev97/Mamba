<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Room · Mamba</title>
<style>
  :root {
    --bg:#101310;
    --panel:#171b18;
    --panel-2:#1d221e;
    --panel-3:#242b26;
    --line:#303832;
    --line-strong:#465148;
    --text:#eef3ef;
    --muted:#a2aca5;
    --dim:#737e76;
    --green:#39d779;
    --green-soft:#173d28;
    --amber:#f3b84b;
    --amber-soft:#382b16;
    --blue:#58bfe7;
    --blue-soft:#153442;
    --red:#f17b7b;
  }

  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    font-size:14px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  button, input, textarea { font:inherit; }
  button { letter-spacing:0; }

  .app-head {
    min-height:64px;
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:13px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:#131713;
  }
  .back-btn, .icon-btn {
    min-width:38px;
    height:38px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
  }
  .back-btn {
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:0 11px;
    white-space:nowrap;
  }
  .back-btn:hover, .icon-btn:hover { border-color:var(--line-strong); background:var(--panel-3); }
  .title-wrap { min-width:0; }
  .title-wrap h1 { margin:0; font-size:17px; letter-spacing:0; }
  .title-wrap p { margin:3px 0 0; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live-state { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; white-space:nowrap; }
  .live-state i { width:8px; height:8px; border-radius:50%; background:var(--green); }

  .number-bar {
    min-height:47px;
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:7px 14px 0;
    border-bottom:1px solid var(--line);
    background:#131713;
    overflow-x:auto;
  }
  .tab {
    min-height:39px;
    padding:8px 13px;
    border:1px solid transparent;
    border-bottom:0;
    border-radius:7px 7px 0 0;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
  }
  .tab.active { color:var(--text); background:var(--panel); border-color:var(--line); }
  .tab .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:7px; }
  .tab .cnt { color:var(--dim); margin-left:5px; font-size:11px; }

  .mobile-switch {
    display:none;
    min-height:45px;
    padding:6px;
    gap:5px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .mobile-switch button {
    flex:1;
    min-height:32px;
    border:1px solid transparent;
    border-radius:6px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
  }
  .mobile-switch button.on { color:var(--text); background:var(--panel-3); border-color:var(--line); }

  .workspace {
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(235px,1.6fr) minmax(500px,7fr) minmax(330px,3.2fr);
    gap:12px;
    padding:12px;
    background:var(--bg);
  }
  .panel {
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
  }
  .reply-panel { background:var(--bg); }
  .ai-panel { background:#181713; }

  .panel-head {
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
  }
  .panel-title { min-width:0; }
  .panel-title h2 { margin:0; font-size:13.5px; letter-spacing:0; }
  .panel-title p { margin:3px 0 0; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .section-code {
    flex:0 0 auto;
    min-width:30px;
    height:28px;
    display:grid;
    place-items:center;
    border-radius:6px;
    background:var(--panel-3);
    color:var(--muted);
    font-size:9px;
    font-weight:800;
  }
  .customer-panel .section-code { color:var(--amber); background:var(--amber-soft); }
  .reply-panel .section-code { color:var(--green); background:var(--green-soft); }
  .ai-panel .section-code { color:var(--blue); background:var(--blue-soft); }

  .customer-nav {
    flex:1;
    min-height:0;
    overflow-y:auto;
    background:var(--panel);
  }
  .list-search { position:sticky; top:0; z-index:2; padding:9px; background:var(--panel); border-bottom:1px solid var(--line); }
  .list-search input {
    width:100%;
    height:36px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel-2);
    color:var(--text);
    outline:none;
  }
  .list-search input:focus { border-color:var(--amber); }
  .list-search-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; }
  .new-contact-button {
    min-width:38px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--amber-soft);
    color:var(--amber);
    cursor:pointer;
    font-weight:800;
  }
  .new-contact-form { display:grid; gap:7px; margin-top:8px; padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); }
  .new-contact-form.hidden { display:none; }
  .new-contact-form input, .new-contact-form select, .new-contact-form textarea {
    height:34px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--bg);
    color:var(--text);
  }
  .new-contact-form textarea { height:54px; resize:vertical; }
  .new-contact-project.hidden { display:none; }
  .new-contact-actions { display:grid; grid-template-columns:1fr auto; gap:6px; }
  .new-contact-actions button { min-height:32px; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-weight:750; }
  .new-contact-start { background:var(--green-soft); color:var(--green); }
  .new-contact-cancel { background:transparent; color:var(--muted); }
  .new-contact-note { color:var(--dim); font-size:9px; line-height:1.4; }
  .new-contact-error { color:var(--red); font-size:9.5px; }
  .list-filters { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; margin-top:7px; }
  .list-filters button {
    min-height:29px;
    border:1px solid var(--line);
    border-radius:6px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:11.5px;
    font-weight:700;
  }
  .list-filters button.on { color:var(--text); background:var(--panel-3); border-color:var(--line-strong); }
  .filter-count { margin-left:4px; color:var(--dim); font-size:9px; }
  .list-filters button.on .filter-count { color:var(--muted); }
  .customer-row {
    width:100%;
    min-height:68px;
    display:grid;
    grid-template-columns:30px minmax(0,1fr);
    align-items:center;
    gap:8px;
    padding:8px 9px;
    border:0;
    border-bottom:1px solid var(--line);
    border-left:3px solid transparent;
    background:transparent;
    color:var(--text);
    text-align:left;
    cursor:pointer;
  }
  .customer-row:hover { background:var(--panel-2); }
  .customer-row.active { background:var(--panel-3); border-left-color:var(--amber); }
  .customer-row.pending .avatar { color:var(--amber); background:var(--amber-soft); }
  .avatar {
    width:28px;
    height:28px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--blue-soft);
    color:var(--blue);
    font-size:10px;
    font-weight:800;
  }
  .customer-main { min-width:0; }
  .customer-name { display:block; font-size:12.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .customer-phone { display:block; margin-top:3px; color:var(--dim); font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .customer-status { display:flex; align-items:center; gap:5px; margin-top:4px; color:var(--dim); font-size:9px; }
  .pending-mark { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--amber); }
  .followup-chip {
    display:inline-flex;
    align-items:center;
    min-width:0;
    max-width:100%;
    padding:2px 5px;
    border-radius:4px;
    background:var(--panel-3);
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .followup-chip.overdue { color:var(--red); background:#3a2020; }
  .followup-chip.today { color:var(--amber); background:var(--amber-soft); }
  .followup-chip.later { color:var(--blue); background:var(--blue-soft); }
  .list-empty, .feed-empty {
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--dim);
    font-size:12px;
    text-align:center;
    line-height:1.5;
  }

  .feed-label {
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    color:var(--muted);
    font-size:10.5px;
    font-weight:700;
  }
  .feed-count { color:var(--dim); font-weight:600; }
  .message-feed {
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:16px;
  }
  .day-sep {
    align-self:center;
    margin:8px 0 2px;
    color:var(--dim);
    font-size:9.5px;
    text-align:center;
  }
  .day-sep:first-child { margin-top:0; }
  .entry {
    width:fit-content;
    min-width:130px;
    max-width:72%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel-2);
    line-height:1.45;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .entry-text { white-space:pre-wrap; overflow-wrap:anywhere; }
  .entry.inbound { align-self:flex-start; border-bottom-left-radius:3px; }
  .entry.outbound { align-self:flex-end; border-color:#285039; border-bottom-right-radius:3px; background:#17291e; }
  .entry-meta {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:7px;
    color:var(--dim);
    font-size:9.5px;
  }
  .entry-source { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-time { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .delivery-mark { font-weight:800; letter-spacing:-2px; color:#91a0ae; cursor:help; }
  .delivery-mark.delivered { color:#b6c2cc; }
  .delivery-mark.read { color:#55b7ff; }
  .delivery-mark.failed { color:var(--red); letter-spacing:0; }
  .media-card {
    width:min(270px,100%);
    min-height:64px;
    display:grid;
    grid-template-columns:42px minmax(0,1fr) 26px;
    align-items:center;
    gap:9px;
    padding:8px;
    border:1px solid var(--line-strong);
    border-radius:9px;
    background:#1b201d;
    color:var(--text);
    cursor:pointer;
    text-align:left;
  }
  .media-card:hover { border-color:#416153; background:#1e2722; }
  .media-card:disabled { cursor:wait; opacity:.75; }
  .media-card.error { border-color:#704141; }
  .media-icon {
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:7px;
    background:var(--blue-soft);
    color:var(--blue);
    font-size:17px;
  }
  .media-card[data-media-kind="video"] .media-icon { background:#28223b; color:#b9a7ff; }
  .media-card[data-media-kind="document"] .media-icon { background:var(--amber-soft); color:var(--amber); }
  .media-copy { min-width:0; }
  .media-copy strong { display:block; font-size:11px; }
  .media-copy small { display:block; margin-top:3px; color:var(--dim); font-size:9px; line-height:1.35; }
  .media-open {
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--panel-3);
    color:var(--muted);
    font-size:10px;
  }
  .media-caption { margin-top:7px; white-space:pre-wrap; }
  .media-preview {
    width:min(290px,100%);
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:9px;
    background:#0c100e;
  }
  .message-image {
    display:block;
    width:100%;
    max-height:340px;
    object-fit:cover;
    cursor:zoom-in;
  }
  .message-video {
    display:block;
    width:100%;
    max-height:360px;
    background:#080a09;
  }
  .media-document {
    min-height:58px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    color:var(--blue);
    text-decoration:none;
  }

  .composer-dock { border-top:1px solid var(--line); background:var(--panel); }
  .image-preview {
    min-height:64px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
  }
  .image-preview.hidden { display:none; }
  .image-preview img { width:48px; height:48px; object-fit:cover; border-radius:6px; }
  .image-preview span { min-width:0; flex:1; color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .image-preview button { border:0; background:transparent; color:var(--red); cursor:pointer; font-size:18px; }
  .composer { display:grid; grid-template-columns:38px minmax(0,1fr) 62px; align-items:end; gap:8px; padding:10px; }
  .composer textarea {
    width:100%;
    min-height:40px;
    max-height:130px;
    resize:none;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:7px;
    outline:none;
    background:var(--panel-2);
    color:var(--text);
    line-height:1.4;
  }
  .composer textarea:focus { border-color:var(--green); }
  .composer button {
    height:40px;
    border:1px solid var(--line);
    border-radius:7px;
    cursor:pointer;
  }
  .attach-btn { background:var(--panel-3); color:var(--text); font-size:18px; }
  .send-btn { background:var(--green); border-color:var(--green) !important; color:#07140b; font-weight:800; }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  .stopped-note { padding:14px; color:var(--red); text-align:center; font-size:11.5px; }

  .side-scroll { flex:1; min-height:0; overflow-y:auto; }
  .followup-content { padding:14px; border-bottom:1px solid var(--line); background:#171a17; }
  .ai-content { min-height:0; padding:14px; }
  .ai-empty { min-height:180px; display:grid; place-items:center; color:var(--dim); text-align:center; font-size:12px; line-height:1.5; }
  .planner-empty { padding:14px; border:1px dashed var(--line-strong); border-radius:7px; color:var(--muted); font-size:11px; line-height:1.55; }
  .planner-empty a { color:var(--blue); }
  .planner-current {
    padding:11px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel-2);
  }
  .planner-current.overdue { border-color:#754141; background:#281b1b; }
  .planner-current.today { border-color:#6e5424; background:#2a2418; }
  .planner-current.later { border-color:#31596a; background:#17242a; }
  .planner-status-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .planner-status-row strong { font-size:12px; }
  .planner-badge { padding:3px 7px; border-radius:999px; color:var(--muted); background:var(--panel-3); font-size:9px; font-weight:800; }
  .planner-badge.overdue { color:var(--red); }
  .planner-badge.today { color:var(--amber); }
  .planner-badge.later { color:var(--blue); }
  .planner-meta { margin-top:7px; color:var(--muted); font-size:10px; line-height:1.45; }
  .planner-note { margin-top:7px; color:var(--dim); font-size:9.5px; white-space:pre-wrap; }
  .planner-heading { margin:14px 0 7px; color:var(--muted); font-size:9px; font-weight:850; text-transform:uppercase; letter-spacing:.08em; }
  .quick-times { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
  .quick-times button {
    min-height:31px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel-2);
    color:var(--muted);
    cursor:pointer;
    font-size:10.5px;
    font-weight:700;
  }
  .quick-times button:hover { color:var(--text); border-color:var(--line-strong); }
  .planner-form { display:grid; gap:7px; }
  .planner-row { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .planner-field { display:grid; gap:4px; }
  .planner-field span { color:var(--dim); font-size:9px; font-weight:700; }
  .planner-field input, .planner-field select, .planner-field textarea {
    width:100%;
    min-width:0;
    min-height:35px;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--bg);
    color:var(--text);
    outline:none;
  }
  .planner-field input:focus, .planner-field select:focus, .planner-field textarea:focus { border-color:var(--blue); }
  .planner-field textarea { min-height:60px; resize:vertical; line-height:1.4; }
  .planner-actions { display:grid; grid-template-columns:1fr auto; gap:7px; }
  .planner-actions button, .planner-link {
    min-height:36px;
    border:1px solid var(--line);
    border-radius:7px;
    cursor:pointer;
    font-weight:800;
    font-size:11px;
  }
  .planner-save { background:var(--blue); border-color:var(--blue) !important; color:#07151b; }
  .planner-done { padding:0 11px; background:var(--panel-3); color:var(--green); }
  .planner-link { display:grid; place-items:center; margin-top:8px; color:var(--muted); text-decoration:none; background:var(--panel-2); }
  .planner-feedback { min-height:16px; margin-top:7px; color:var(--green); font-size:9.5px; line-height:1.4; }
  .planner-feedback.error { color:var(--red); }
  .side-section-label { padding:9px 14px 0; color:var(--dim); font-size:9px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
  .signal-line { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .signal-dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .signal-dot.green { background:var(--green); }
  .signal-dot.red { background:var(--red); }
  .signal-dot.amber { background:var(--amber); }
  .signal-label { color:var(--muted); font-size:10.5px; font-weight:800; }
  .insight-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin:0 -14px 14px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--line); }
  .insight { min-height:65px; padding:10px 14px; background:#181713; }
  .insight span { display:block; color:var(--dim); font-size:9.5px; }
  .insight strong { display:block; margin-top:5px; font-size:11.5px; line-height:1.35; overflow-wrap:anywhere; }
  .insight.intent-positive { box-shadow:inset 3px 0 0 var(--green); background:#14251a; }
  .insight.intent-follow-up { box-shadow:inset 3px 0 0 var(--blue); background:#15242a; }
  .insight.intent-not-interested { box-shadow:inset 3px 0 0 var(--amber); background:#292216; }
  .insight.intent-stop { box-shadow:inset 3px 0 0 var(--red); background:#2b1919; }
  .insight.intent-positive strong { color:var(--green); }
  .insight.intent-follow-up strong { color:var(--blue); }
  .insight.intent-not-interested strong { color:var(--amber); }
  .insight.intent-stop strong { color:var(--red); }
  .intent-action {
    margin:0 0 14px;
    padding:11px;
    border:1px solid #6e5424;
    border-radius:8px;
    background:var(--amber-soft);
  }
  .intent-action.applied { border-color:#356348; background:var(--green-soft); }
  .intent-action strong { display:block; color:var(--amber); font-size:11.5px; }
  .intent-action.applied strong { color:var(--green); }
  .intent-action p { margin:5px 0 9px; color:#d7c291; font-size:9.5px; line-height:1.45; }
  .intent-action.applied p { margin-bottom:0; color:#a9d7b7; }
  .intent-apply {
    width:100%;
    min-height:36px;
    border:1px solid var(--amber);
    border-radius:7px;
    background:var(--amber);
    color:#1b1408;
    cursor:pointer;
    font-size:11px;
    font-weight:850;
  }

<script>
const $ = (id) => document.getElementById(id);
const MEDIA_RE = /^\[(image|video|document|sticker)\]$/;

let numbers = [];
let currentInstance = "";
let threads = [];
let currentPhone = "";
let searchText = "";
let listFilter = "all";
let threadsSig = "";
let currentThreadSig = "";
let pendingImage = null;
let newContactEnabled = false;
let newContactOpen = false;
let newContactAwaitingFirstSend = null;
let newContactLeadTypes = [];
let newContactProjects = [];
let followUpRecords = [];
let followUpByPhone = new Map();
let followUpLoadError = "";
let currentThreadData = null;
let followUpSelection = new Map();
let mediaObserver = null;

async function jget(url) {
  const response = await fetch(url, { cache:"no-store" });
  return response.json();
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;",
  })[char]);
}

function initials(name) {
  return String(name || "?").trim().split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
}

function relTime(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  const now = new Date();
  if (date.toDateString() === now.toDateString()) {
    return date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
  }
  const days = Math.max(1, Math.round((now - date) / 86400000));
  if (days === 1) return "昨天";
  if (days < 7) return `${days} 天前`;
  return date.toLocaleDateString([], { month:"2-digit", day:"2-digit" });
}

function phoneKey(value) {
  let digits = String(value || "").replace(/\D/g, "");
  if (digits.startsWith("0")) digits = `60${digits.slice(1)}`;
  return digits;
}

function followUpsForPhone(phone) {
  return followUpByPhone.get(phoneKey(phone)) || [];
}

function primaryFollowUp(phone) {
  return followUpsForPhone(phone)[0] || null;
}

function followUpTone(record) {
  if (!record) return "unplanned";
  if (record.overdue) return "overdue";
  if (record.dueToday) return "today";
  if (record.followUpAt) return "later";
  return "unplanned";
}

function followUpWhen(record) {
  if (!record?.followUpAt) return "未安排时间";
  const date = new Date(record.followUpAt);
  if (Number.isNaN(date.getTime())) return "未安排时间";
  const day = date.toLocaleDateString([], { month:"2-digit", day:"2-digit" });
  const time = date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
  if (record.overdue) return `已逾期 · ${day} ${time}`;
  if (record.dueToday) return `今天 · ${time}`;
  return `${day} ${time}`;
}

async function loadFollowUpRecords() {
  try {
    const data = await jget("/api/follow-up");
    if (!data?.ok) throw new Error(data?.error || "Follow-up 读取失败");
    followUpRecords = data.records || [];
    const grouped = new Map();
    for (const record of followUpRecords) {
      const key = phoneKey(record.phone);
      if (!key) continue;
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(record);
    }
    followUpByPhone = grouped;
    followUpLoadError = "";
  } catch (error) {
    followUpLoadError = error.message;
  }
}

function threadMatchesFilter(thread, filter) {
  const record = primaryFollowUp(thread.phone);
  if (filter === "pending") return thread.lastDirection === "inbound";
  if (filter === "overdue") return record?.overdue === true;
  if (filter === "today") return record?.dueToday === true && record?.overdue !== true;
  if (filter === "scheduled") return Boolean(record?.followUpAt) && !record.overdue && !record.dueToday;
  if (filter === "unplanned") return !record?.followUpAt;
  return true;
}

function filterCount(filter) {
  return threads.filter((thread) => threadMatchesFilter(thread, filter)).length;
}

function payloadOf(message) {
  try { return JSON.parse(message?.payloadJson || "{}"); }
  catch { return {}; }
}

function goBack() {
  try {
    const ref = document.referrer ? new URL(document.referrer) : null;
    if (ref && ref.origin === location.origin && ref.pathname !== location.pathname) {
      history.back();
      return;
    }
  } catch {}
  location.href = "/control-center";
}

function setMobilePane(pane) {
  document.body.dataset.mobilePane = pane;
  document.querySelectorAll(".mobile-switch button").forEach((button) => {
    button.classList.toggle("on", button.dataset.pane === pane);
  });
}

$("pageBack").addEventListener("click", goBack);
$("threadBack").addEventListener("click", () => setMobilePane("customer"));
document.querySelectorAll(".mobile-switch button").forEach((button) => {
  button.addEventListener("click", () => setMobilePane(button.dataset.pane));
});

async function loadNumbers() {
  const data = await jget("/api/inbox/numbers").catch(() => ({ numbers:[] }));
  numbers = data.numbers || [];
  if (!numbers.length) {
    $("tabs").innerHTML = '<span class="list-empty">没有连接中的号码</span>';
    $("customerNav").innerHTML = '<div class="list-empty">请先到 Settings 连接 WhatsApp</div>';
    return;
  }
  currentInstance = numbers[0].instance;
  renderTabs();
  await loadThreads();
}

async function loadInboxCapabilities() {
  const data = await jget("/api/inbox/capabilities").catch(() => null);
  newContactEnabled = data?.capabilities?.newContact === true;
  newContactLeadTypes = data?.leadTypes || [];
  newContactProjects = data?.projects || [];
}

function renderTabs() {
  $("tabs").innerHTML = numbers.map((number) => `
    <button class="tab ${number.instance === currentInstance ? "active" : ""}" type="button" data-inst="${esc(number.instance)}">
      <span class="dot"></span>${esc(number.instance)}
      <span class="cnt" data-cnt="${esc(number.instance)}"></span>
    </button>`).join("");
  document.querySelectorAll("#tabs .tab").forEach((tab) => {
    tab.addEventListener("click", async () => {
      currentInstance = tab.dataset.inst;
      currentPhone = "";
      currentThreadSig = "";
      pendingImage = null;
      newContactOpen = false;
      newContactAwaitingFirstSend = null;
      renderTabs();
      renderThreadEmpty();
      await loadThreads();
    });
  });
}

async function loadThreads({ silent = false } = {}) {
  if (!silent) {
    $("customerNav").innerHTML = '<div class="list-empty">读取客户中</div>';
    threadsSig = "";
  }
  const [data] = await Promise.all([
    jget(`/api/inbox/threads?instance=${encodeURIComponent(currentInstance)}&filter=all`)
      .catch(() => ({ threads:[] })),
    loadFollowUpRecords(),
  ]);
  threads = data.threads || [];
  const count = document.querySelector(`[data-cnt="${CSS.escape(currentInstance)}"]`);
  if (count) count.textContent = threads.length || "";
  const followUpSignature = followUpRecords
    .map((record) => `${record.id}:${record.followUpAt || ""}:${record.nextAction || ""}:${record.priority || ""}`)
    .join("|");
  const signature = `${listFilter}|${threads.map((thread) => `${thread.phone}:${thread.lastAt}:${thread.replyCount}`).join("|")}::${searchText}::${followUpSignature}`;
  if (silent && signature === threadsSig) return;
  if (silent && document.activeElement === $("listSearch")) return;
  threadsSig = signature;
  renderList();
}

function renderList() {
  const query = searchText.trim().toLowerCase();
  const filtered = threads.filter((thread) => threadMatchesFilter(thread, listFilter));
  const shown = query
    ? filtered.filter((thread) => (thread.name || "").toLowerCase().includes(query) || (thread.phone || "").includes(query))
    : filtered;
  const filters = [
    ["all", "全部"],
    ["pending", "待回复"],
    ["overdue", "已逾期"],
    ["today", "今天"],
    ["scheduled", "已安排"],
    ["unplanned", "未安排"],
  ];
  const search = `
    <div class="list-search">
      <div class="list-search-row">
        <input id="listSearch" type="search" placeholder="搜索名字或号码" value="${esc(searchText)}" aria-label="搜索客户">
        ${newContactEnabled ? '<button class="new-contact-button" id="newContactButton" type="button" title="新增号码" aria-label="新增号码">＋</button>' : ""}
      </div>
      ${newContactEnabled ? `
        <form class="new-contact-form ${newContactOpen ? "" : "hidden"}" id="newContactForm">
          <input id="newContactPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="电话号码，例如 0123456789" aria-label="新客户电话号码">
          <input id="newContactName" type="text" autocomplete="off" placeholder="名字（可不填）" aria-label="新客户名字">
          <select id="newContactLeadType" required aria-label="客户类型">
            <option value="">选择客户类型</option>
            ${newContactLeadTypes.map((type) => `<option value="${esc(type.key)}" ${type.default ? "selected" : ""}>${esc(type.label)}</option>`).join("")}
          </select>
          <select class="new-contact-project hidden" id="newContactProject" aria-label="Project">
            <option value="">选择 Project</option>
            ${newContactProjects.map((project) => `<option value="${esc(project.id)}">${esc(project.name)}</option>`).join("")}
          </select>
          <textarea id="newContactNote" placeholder="通话备注（可不填）" aria-label="客户备注"></textarea>
          <div class="new-contact-note" id="newContactTypeNote">${
            newContactLeadTypes.find((type) => type.default)?.description
              ? `${esc(newContactLeadTypes.find((type) => type.default).description)} · 将使用 ${esc(currentInstance)}`
              : `将使用 ${esc(currentInstance)}；请选择客户类型。`
          }</div>
          <div class="new-contact-error" id="newContactError"></div>
          <div class="new-contact-actions">
            <button class="new-contact-start" type="submit">开始聊天</button>
            <button class="new-contact-cancel" id="newContactCancel" type="button">取消</button>
          </div>
        </form>` : ""}
      <div class="list-filters">
        ${filters.map(([value, label]) => `
          <button type="button" class="${listFilter === value ? "on" : ""}" data-filter="${value}">
            ${label}<span class="filter-count">${filterCount(value)}</span>
          </button>`).join("")}
      </div>
    </div>`;

  if (!shown.length) {
    $("customerNav").innerHTML = search + '<div class="list-empty">这个分类目前没有客户</div>';
  } else {
    $("customerNav").innerHTML = search + shown.map((thread) => {
      const pending = thread.lastDirection === "inbound";
      const followUp = primaryFollowUp(thread.phone);
      const followUpLabel = followUp
        ? `${followUpWhen(followUp)}${followUp.nextAction ? ` · ${followUp.nextAction}` : ""}`
        : "未建立 Follow-up";
      return `
        <button class="customer-row ${thread.phone === currentPhone ? "active" : ""} ${pending ? "pending" : ""}" type="button" data-phone="${esc(thread.phone)}">
          <span class="avatar">${esc(initials(thread.name || thread.phone))}</span>
          <span class="customer-main">
            <span class="customer-name">${esc(thread.name || thread.phone)}</span>
            <span class="customer-phone">${esc(thread.phone)}</span>
            <span class="customer-status">${pending ? '<i class="pending-mark"></i>待回复' : esc(relTime(thread.lastAt))}</span>
            <span class="followup-chip ${followUpTone(followUp)}">${esc(followUpLabel)}</span>
          </span>
        </button>`;
    }).join("");
  }
  $("customerListSubtitle").textContent = `${shown.length}/${threads.length} 位 · 逾期 ${filterCount("overdue")} · 今天 ${filterCount("today")}`;

  const input = $("listSearch");
  if (input) {
    input.addEventListener("input", (event) => {
      searchText = event.target.value;
      const caret = input.selectionStart;
      renderList();
      const next = $("listSearch");
      if (next) {
        next.focus();
        next.setSelectionRange(caret, caret);
      }
    });
  }
  $("newContactButton")?.addEventListener("click", () => {
    newContactOpen = !newContactOpen;
    renderList();
    if (newContactOpen) $("newContactPhone")?.focus();
  });
  $("newContactCancel")?.addEventListener("click", () => {
    newContactOpen = false;
    renderList();
  });
  $("newContactForm")?.addEventListener("submit", startNewContact);
  $("newContactLeadType")?.addEventListener("change", updateNewContactType);
  document.querySelectorAll(".list-filters button").forEach((button) => {
    button.addEventListener("click", () => {
      if (listFilter === button.dataset.filter) return;
      listFilter = button.dataset.filter;
      threadsSig = "";
      renderList();
    });
  });
  document.querySelectorAll(".customer-row").forEach((row) => {
    row.addEventListener("click", () => openThread(row.dataset.phone));
  });
}

function updateNewContactType() {
  const type = newContactLeadTypes.find((item) => item.key === $("newContactLeadType")?.value);
  const project = $("newContactProject");
  if (project) {
    project.classList.toggle("hidden", !type?.requiresProject);
    project.required = type?.requiresProject === true;
    if (!type?.requiresProject) project.value = "";
  }
  if ($("newContactTypeNote")) {
    $("newContactTypeNote").textContent = type
      ? `${type.description} · 将使用 ${currentInstance}`
      : `将使用 ${currentInstance}；请选择客户类型。`;
  }
}

async function startNewContact(event) {
  event.preventDefault();
  const phoneInput = $("newContactPhone");
  const nameInput = $("newContactName");
  const typeInput = $("newContactLeadType");
  const projectInput = $("newContactProject");
  const noteInput = $("newContactNote");
  const errorBox = $("newContactError");
  const submit = event.currentTarget.querySelector('button[type="submit"]');
  errorBox.textContent = "";
  submit.disabled = true;
  submit.textContent = "建立中";
  try {
    const response = await fetch("/api/inbox/new-contact", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        instance:currentInstance,
        phone:phoneInput.value,
        name:nameInput.value,
        leadType:typeInput.value,
        projectId:projectInput.value,
        note:noteInput.value,
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "新增号码失败");
    newContactOpen = false;
    newContactAwaitingFirstSend = {
      phone:data.contact.phone,
      typeLabel:data.contact.typeLabel || typeInput.selectedOptions[0]?.textContent || "Customer",
    };
    await openThread(data.contact.phone);
    renderList();
    $("composerText")?.focus();
    if (data.warning) window.alert(data.warning);
  } catch (error) {
    errorBox.textContent = error.message;
    submit.disabled = false;
    submit.textContent = "开始聊天";
  }
}

function renderThreadEmpty() {
  currentThreadData = null;
  $("replyTitle").textContent = "Conversation";
  $("replySubtitle").textContent = "选择客户后开始";
  $("conversationMessages").innerHTML = '<div class="feed-empty">这里会显示完整对话</div>';
  $("composerDock").innerHTML = "";
  $("aiSubtitle").textContent = "选择客户后安排下一步";
  $("followUpContent").innerHTML = '<div class="planner-empty">选择客户后安排 Follow-up</div>';
  $("aiContent").innerHTML = '<div class="ai-empty">选择客户后查看建议</div>';
}

function renderLoadingThread() {
  $("conversationMessages").innerHTML = '<div class="feed-empty">读取完整对话中</div>';
  $("followUpContent").innerHTML = '<div class="planner-empty">读取 Follow-up 资料中</div>';
  $("aiContent").innerHTML = '<div class="ai-empty">分析对话中</div>';
}

async function openThread(phone, { refresh = false } = {}) {
  const switchingCustomer = currentPhone && currentPhone !== phone;
  if (switchingCustomer) pendingImage = null;
  currentPhone = phone;
  document.querySelectorAll(".customer-row").forEach((row) => {
    row.classList.toggle("active", row.dataset.phone === phone);
  });
  if (!refresh) {
    currentThreadSig = "";
    renderLoadingThread();
    setMobilePane("reply");
  }
  const data = await jget(`/api/inbox/thread?phone=${encodeURIComponent(phone)}`).catch(() => null);
  if (!data || !data.ok) {
    if (!refresh) {
      $("conversationMessages").innerHTML = '<div class="feed-empty">对话读取失败</div>';
      $("aiContent").innerHTML = '<div class="ai-empty">建议读取失败</div>';
    }
    return;
  }

  const messages = data.messages || [];
  const last = messages.at(-1);
  const latestInbound = [...messages].reverse().find((message) => message.direction === "inbound");
  const followUp = primaryFollowUp(phone);
  const signature = `${messages.length}::${last?.sentAt || ""}::${last?.text || ""}::${latestInbound?.payloadJson || ""}::${data.contact?.dispositionStatus || ""}::${followUp?.id || ""}:${followUp?.followUpAt || ""}:${followUp?.nextAction || ""}:${followUp?.priority || ""}`;
  if (refresh && signature === currentThreadSig) return;

  const draft = $("composerText")?.value || "";
  const hadFocus = document.activeElement === $("composerText");
  currentThreadSig = signature;
  currentThreadData = { contact:data.contact, messages };
  renderThread(data.contact, messages);

  const textarea = $("composerText");
  if (textarea && draft) {
    textarea.value = draft;
    resizeComposer(textarea);
    if (hadFocus) {
      textarea.focus();
      textarea.setSelectionRange(draft.length, draft.length);
    }
  }
  if (pendingImage) showImagePreview();
}

function sourceLabel(message) {
  if (message.source === "brain") return "AI";
  return "我们";
}

function deliveryMark(message) {
  if (message?.direction !== "outbound") return "";
  const status = String(payloadOf(message).deliveryStatus || "").toUpperCase();
  const marks = {
    PENDING: ["○", "正在等待 WhatsApp 接收", ""],
    ERROR: ["!", "发送失败；请检查号码或连接，不能据此直接判定被封锁", "failed"],
    SERVER_ACK: ["✓", "WhatsApp 服务器已接收（单勾）", ""],
    DELIVERY_ACK: ["✓✓", "已送达客户装置（双勾）", "delivered"],
    READ: ["✓✓", "客户已读", "read"],
    PLAYED: ["✓✓", "客户已播放", "read"],
  };
  const item = marks[status];
  if (!item) return "";
  return `<span class="delivery-mark ${item[2]}" title="${esc(item[1])}" aria-label="${esc(item[1])}">${item[0]}</span>`;
}

function messageContent(message) {
  const raw = (message.text || "").trim();
  const payload = payloadOf(message);
  const markerKind = MEDIA_RE.test(raw) ? raw.replace(/[\[\]]/g, "") : "";
  const kind = String(payload.mediaKind || markerKind || "").toLowerCase();
  if (!["image", "video", "document", "sticker"].includes(kind)) return esc(message.text || "");
  const labels = {
    image: ["照片", "靠近画面时自动加载", "▧"],
    video: ["影片", "点击后加载播放", "▶"],
    document: ["文件", "点击后读取", "≡"],
    sticker: ["贴图", "靠近画面时自动加载", "◇"],
  };
  const [label, hint, icon] = labels[kind];
  const placeholder = MEDIA_RE.test(raw) || raw === "[已发送图片]";
  const caption = placeholder ? "" : raw;
  return `
    <button class="media-card" type="button"
      data-media-id="${esc(message.id || "")}"
      data-media-kind="${esc(kind)}"
      data-media-direction="${esc(message.direction || "inbound")}"
      data-media-file="${esc(payload.mediaFileName || "")}"
      aria-label="加载${esc(label)}">
      <span class="media-icon">${icon}</span>
      <span class="media-copy"><strong>${esc(label)}</strong><small>${esc(hint)}</small></span>
      <span class="media-open">${kind === "video" ? "▶" : "↗"}</span>
    </button>
    ${caption ? `<div class="media-caption">${esc(caption)}</div>` : ""}`.trim();
}

function conversationMarkup(messages) {
  const selected = messages.filter((message) => ["inbound", "outbound"].includes(message.direction));
  if (!selected.length) return '<div class="feed-empty">暂无消息</div>';
  let lastDay = "";
  const items = [];
  for (const message of selected) {
    const direction = message.direction === "inbound" ? "inbound" : "outbound";
    const date = new Date(message.sentAt);
    const day = date.toLocaleDateString([], { year:"numeric", month:"2-digit", day:"2-digit" });
    if (day !== lastDay) {
      items.push(`<div class="day-sep">${esc(day)}</div>`);
      lastDay = day;
    }
    const time = date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
    items.push(`
      <article class="entry ${direction}">
        <div class="entry-text">${messageContent(message)}</div>
        <footer class="entry-meta">
          <span class="entry-source">${direction === "outbound" ? esc(sourceLabel(message)) : "客户"}</span>
          <span class="entry-time">${deliveryMark(message)}<time>${esc(time)}</time></span>
        </footer>
      </article>`);
  }
  return items.join("");
}

function signalClass(signal) {
  const value = String(signal || "").toUpperCase();
  if (value === "GREEN") return "green";
  if (value === "RED") return "red";
  if (value === "YELLOW" || value === "AMBER") return "amber";
  return "";
}

function intentClass(category, signal) {
  const value = `${category || ""} ${signal || ""}`.trim().toLowerCase();
  if (/do not contact|\bstop\b|blocked|red/.test(value)) return "intent-stop";
  if (/not interested|no interest|reject|不感兴趣|没兴趣/.test(value)) return "intent-not-interested";
  if (/follow.?up|appointment|blue/.test(value)) return "intent-follow-up";
  if (/interested|warm|positive|green/.test(value)) return "intent-positive";
  return "";
}

function suggestedDisposition(category) {
  const value = String(category || "").trim().toLowerCase();
  return /not interested|no interest|reject|不感兴趣|没兴趣/.test(value)
    ? "NOT_INTERESTED"
    : "";
}

function toDateTimeLocal(value) {
  const date = new Date(value || "");
  if (Number.isNaN(date.getTime())) return "";
  const pad = (part) => String(part).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function presetFollowUpTime(kind) {
  const date = new Date();
  date.setSeconds(0, 0);
  if (kind === "today") {
    if (date.getHours() < 18) date.setHours(18, 0, 0, 0);
    else {
      date.setHours(date.getHours() + 2, 0, 0, 0);
    }
  } else {
    const days = kind === "tomorrow" ? 1 : kind === "three_days" ? 3 : 7;
    date.setDate(date.getDate() + days);
    date.setHours(10, 0, 0, 0);
  }
  return toDateTimeLocal(date);
}

function actionForRecord(record) {
  const action = String(record?.nextAction || "").toLowerCase();
  if (action.includes("call")) return "call";
  if (action.includes("price")) return "send_price";
  if (action.includes("appointment") || action.includes("viewing") || action.includes("book")) return "book_appointment";
  return "follow_up";
}

function selectedFollowUp(contact) {
  const records = followUpsForPhone(contact?.phone);
  const selectedId = followUpSelection.get(phoneKey(contact?.phone));
  return records.find((record) => record.id === selectedId) || records[0] || null;
}

        <strong>${esc(record.project || "未分类 Project")}</strong>

      </div>
      <div class="planner-meta">${esc(record.priority || "MED")} · ${esc(record.nextAction || "Follow Up")} · ${esc(record.reason || "等待安排")}</div>

    <div class="planner-heading">快速安排</div>
    <div class="quick-times">
      <button type="button" data-followup-preset="today">今天稍后</button>
      <button type="button" data-followup-preset="tomorrow">明天 10:00</button>
      <button type="button" data-followup-preset="three_days">3 天后</button>

            <option value="call" ${defaultAction === "call" ? "selected" : ""}>打电话</option>
            <option value="send_price" ${defaultAction === "send_price" ? "selected" : ""}>发送价格</option>
            <option value="book_appointment" ${defaultAction === "book_appointment" ? "selected" : ""}>安排 Appointment</option>

            <option value="LOW" ${priority === "LOW" ? "selected" : ""}>LOW</option>

async function saveChatFollowUp(actionOverride = "") {
  const contact = currentThreadData?.contact;
  const record = contact ? selectedFollowUp(contact) : null;
  const feedback = $("followUpFeedback");
  if (!contact || !record?.id || !feedback) return;
  const action = actionOverride || $("followUpAction")?.value || "follow_up";
  if (action === "done" && !window.confirm(`确认 ${contact.name || contact.phone} 的 Follow-up 已完成？`)) return;

  const atInput = $("followUpAt");
  const selectedAt = atInput?.value || "";
  if (action !== "done" && !selectedAt) {
    feedback.textContent = "请选择提醒时间。";
    feedback.classList.add("error");
    atInput?.focus();
    return;
  }

  const buttons = [$("followUpSave"), $("followUpDone")].filter(Boolean);
  buttons.forEach((button) => { button.disabled = true; });
  feedback.classList.remove("error");
  feedback.textContent = action === "done" ? "正在完成…" : "正在保存…";
  try {
    const response = await fetch("/api/follow-up/action", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id:record.id,
        action,
        followUpAt:selectedAt ? new Date(selectedAt).toISOString() : "",
        priority:$("followUpPriority")?.value || "MED",
        note:$("followUpNote")?.value || "",
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Follow-up 保存失败");
    await loadFollowUpRecords();
    renderList();
    renderFollowUpPanel(contact);
    const nextFeedback = $("followUpFeedback");
    if (nextFeedback) nextFeedback.textContent = action === "done" ? "已完成，不会再出现在待跟进列表。" : "已保存，并同步到 Follow-Up Desk。";
  } catch (error) {
    feedback.textContent = error.message;
    feedback.classList.add("error");
    buttons.forEach((button) => { button.disabled = false; });
  }
}

function renderAiPanel(contact, messages) {
  const inbound = [...messages].reverse().filter((message) => message.direction === "inbound");
  const latestCustomer = inbound[0] || null;
  const suggestionMessage = inbound.find((message) => {
    const payload = payloadOf(message);
    return payload.suggestedReply || payload.category || payload.nextAction || payload.signal;
  }) || latestCustomer;
  const payload = payloadOf(suggestionMessage);
  const suggestion = String(payload.suggestedReply || "").trim();
  const signal = String(payload.signal || "").toUpperCase() || "UNCLASSIFIED";
  const category = String(payload.category || payload.aiCategory || "").trim() || "未分类";
  const nextAction = String(payload.nextAction || "").trim() || "人工判断";
  const intentTone = intentClass(category, signal);
  const disposition = suggestedDisposition(category);
  const isNotInterested = String(contact.dispositionStatus || "").trim().toLowerCase() === "not interested";
  const dispositionAction = disposition === "NOT_INTERESTED"
    ? isNotInterested
      ? `
        <div class="intent-action applied">
          <strong>✓ 已列为 Not Interested</strong>
          <p>自动 Flow 已停止；这不是全局 Do Not Contact。</p>
        </div>`
      : `
        <div class="intent-action">
          <strong>AI 判断：Not Interested</strong>
          <p>确认后会停止这个客户的自动 Flow，但不会加入全局 STOP 名单。</p>
          <button class="intent-apply" id="applySuggestedDisposition" type="button">列为 Not Interested</button>
          <div class="intent-feedback" id="intentFeedback"></div>
        </div>`
    : "";

  $("aiSubtitle").textContent = contact.name || contact.phone;
  $("aiContent").innerHTML = `
    <div class="signal-line">
      <i class="signal-dot ${signalClass(signal)}"></i>
      <span class="signal-label">${esc(signal)}</span>
    </div>
    <div class="insight-grid">
      <div class="insight ${intentTone}"><span>客户意图</span><strong>${esc(category)}</strong></div>
      <div class="insight ${intentTone}"><span>下一步</span><strong>${esc(nextAction)}</strong></div>
    </div>
    ${dispositionAction}
    <h3 class="ai-section-title">最新客户消息</h3>
    <div class="latest-customer">${latestCustomer ? esc(latestCustomer.text || "") : "暂无客户消息"}</div>
    <h3 class="ai-section-title">建议回复</h3>
    <div class="suggestion" id="suggestionText">${suggestion ? esc(suggestion) : "暂无 AI 建议，请人工查看对话。"}</div>
    <div class="ai-actions">
      <button class="use-btn" id="useSuggestion" type="button" ${suggestion && !contact.stopFlag ? "" : "disabled"}>使用建议</button>
      <button id="copySuggestion" type="button" ${suggestion ? "" : "disabled"} title="复制建议">复制</button>
    </div>
    <div class="ai-note">建议不会自动发送。发送前请确认价格、单位与客户意图。</div>`;

  $("applySuggestedDisposition")?.addEventListener("click", () => {
    applyConversationDisposition("NOT_INTERESTED");
  });
  $("useSuggestion")?.addEventListener("click", () => {
    const textarea = $("composerText");
    if (!textarea) return;
    textarea.value = suggestion;
    resizeComposer(textarea);
    setMobilePane("reply");
    textarea.focus();
    textarea.setSelectionRange(suggestion.length, suggestion.length);
  });
  $("copySuggestion")?.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(suggestion);
      const button = $("copySuggestion");
      button.textContent = "已复制";
      setTimeout(() => { if (button) button.textContent = "复制"; }, 1200);
    } catch {
      alert("无法复制，请手动选择建议文字。");
    }
  });
}

async function applyConversationDisposition(disposition) {
  const contact = currentThreadData?.contact;
  const feedback = $("intentFeedback");
  const button = $("applySuggestedDisposition");
  if (!contact || !feedback || !button) return;
  if (!window.confirm(
    `确认把 ${contact.name || contact.phone} 列为 Not Interested？\n\n系统会停止自动 Flow，但不会加入全局 Do Not Contact。`
  )) return;

  button.disabled = true;
  button.textContent = "保存中";
  feedback.classList.remove("error");
  feedback.textContent = "正在先保存到本机…";
  try {
    const response = await fetch("/api/conversations/disposition", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id:contact.dispositionId || "",
        disposition,
        phone:contact.phone,
        name:contact.name || "",
        project:contact.projectCode || "",
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Not Interested 保存失败");
    contact.dispositionStatus = data.disposition?.status || "Not Interested";
    renderAiPanel(contact, currentThreadData.messages || []);
    await loadFollowUpRecords();
    renderList();
  } catch (error) {
    feedback.textContent = error.message;
    feedback.classList.add("error");
    button.disabled = false;
    button.textContent = "列为 Not Interested";
  }
}

function renderThread(contact, messages) {
  const inbound = messages.filter((message) => message.direction === "inbound");
  const outbound = messages.filter((message) => message.direction === "outbound");
  const stopped = Boolean(contact.stopFlag);

  $("replyTitle").textContent = contact.name || contact.phone;
  $("replySubtitle").textContent = `${contact.phone} · ${inbound.length} 条客户消息 · ${outbound.length} 条我们的回复${stopped ? " · 已 STOP" : ""}`;
  $("conversationMessages").innerHTML = conversationMarkup(messages);
  $("composerDock").innerHTML = stopped
    ? '<div class="stopped-note">该客户已 STOP，回复功能已关闭。</div>'
    : `
      <div class="image-preview hidden" id="imagePreview">
        <img id="imagePreviewThumb" alt="">
        <span id="imagePreviewName"></span>
        <button id="imagePreviewClear" type="button" title="移除图片" aria-label="移除图片">×</button>
      </div>
      <div class="composer">
        <input type="file" id="imageFile" accept="image/*" hidden>
        <button class="attach-btn" id="attachButton" type="button" title="添加图片" aria-label="添加图片">＋</button>
        <textarea id="composerText" rows="1" placeholder="输入回复" aria-label="回复内容"></textarea>
        <button class="send-btn" id="sendButton" type="button">发送</button>
      </div>`;

  renderFollowUpPanel(contact);
  renderAiPanel(contact, messages);
  wireMediaButtons();
  if (!stopped) wireComposer();
  const box = $("conversationMessages");
  box.scrollTop = box.scrollHeight;
}

function wireMediaButtons() {
  mediaObserver?.disconnect();
  mediaObserver = null;
  const buttons = [...document.querySelectorAll(".media-card")];
  buttons.forEach((button) => {
    button.addEventListener("click", () => loadMediaCard(button));
  });
  if (!("IntersectionObserver" in window)) return;
  mediaObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const button = entry.target;
      if (!["image", "sticker"].includes(button.dataset.mediaKind || "")) continue;
      mediaObserver.unobserve(button);
      loadMediaCard(button, { automatic:true });
    }
  }, {
    root:$("conversationMessages"),
    rootMargin:"160px 0px",
    threshold:0.01,
  });
  buttons
    .filter((button) => ["image", "sticker"].includes(button.dataset.mediaKind || ""))
    .forEach((button) => mediaObserver.observe(button));
}

async function loadMediaCard(button, { automatic = false } = {}) {
  if (!button || button.dataset.loading === "true") return;
  button.dataset.loading = "true";
  button.disabled = true;
  button.classList.remove("error");
  const subtitle = button.querySelector(".media-copy small");
  if (subtitle) subtitle.textContent = automatic ? "正在加载缩图…" : "正在读取…";

  try {
    const fileName = button.dataset.mediaFile || "";
    const requestedKind = button.dataset.mediaKind || "";
    const direction = button.dataset.mediaDirection || "inbound";
    const messageId = button.dataset.mediaId || "";
    const data = fileName
      ? { available:true, kind:requestedKind, fileName }
      : await jget(
        `/api/inbox/media?instance=${encodeURIComponent(currentInstance)}`
        + `&phone=${encodeURIComponent(currentPhone)}`
        + `&messageId=${encodeURIComponent(messageId)}`
        + `&direction=${encodeURIComponent(direction)}`
      ).catch(() => null);
    if (!data?.available) throw new Error("这个媒体暂时无法读取");

    const kind = data.kind || requestedKind;
    const src = data.dataUrl || `/api/inbox/media/file?fileName=${encodeURIComponent(data.fileName || "")}`;
    const preview = document.createElement("div");
    preview.className = "media-preview";
    if (kind === "video") {
      const video = document.createElement("video");
      video.className = "message-video";
      video.src = src;
      video.controls = true;
      video.preload = "metadata";
      video.playsInline = true;
      preview.appendChild(video);
    } else if (kind === "document") {
      const link = document.createElement("a");
      link.className = "media-document";
      link.href = src;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "打开客户文件";
      preview.appendChild(link);
    } else {
      const image = document.createElement("img");
      image.className = "message-image";
      image.src = src;
      image.alt = kind === "sticker" ? "客户贴图" : "客户图片";
      image.loading = "lazy";
      image.addEventListener("click", () => openLightbox(src));
      preview.appendChild(image);
    }
    button.replaceWith(preview);
  } catch (error) {
    button.dataset.loading = "false";
    button.disabled = false;
    button.classList.add("error");
    if (subtitle) subtitle.textContent = `${error.message || "无法加载"} · 点击重试`;
  }
}

function resizeComposer(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = `${Math.min(textarea.scrollHeight, 130)}px`;
}

function wireComposer() {
  const textarea = $("composerText");
  const send = $("sendButton");
  const attach = $("attachButton");
  const file = $("imageFile");
  textarea.addEventListener("input", () => resizeComposer(textarea));
  textarea.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      doSend();
    }
  });
  send.addEventListener("click", doSend);
  attach.addEventListener("click", () => file.click());
  file.addEventListener("change", () => {
    const selected = file.files[0];
    if (!selected) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = { dataUrl:String(reader.result), name:selected.name };
      showImagePreview();
    };
    reader.readAsDataURL(selected);
    file.value = "";
  });
  $("imagePreviewClear").addEventListener("click", () => {
    pendingImage = null;
    $("imagePreview").classList.add("hidden");
  });
}

function showImagePreview() {
  if (!pendingImage || !$("imagePreview")) return;
  $("imagePreviewThumb").src = pendingImage.dataUrl;
  $("imagePreviewName").textContent = pendingImage.name;
  $("imagePreview").classList.remove("hidden");
}

async function doSend() {
  const textarea = $("composerText");
  const body = textarea.value.trim();
  if (!body && !pendingImage) return;
  if (newContactAwaitingFirstSend?.phone === currentPhone) {
    const preview = body || "[图片]";
    const confirmed = window.confirm(
      `确认使用 ${currentInstance} 发给新号码 ${currentPhone}？\n客户类型：${newContactAwaitingFirstSend.typeLabel}\n\n${preview.slice(0, 180)}`
    );
    if (!confirmed) return;
  }
  const send = $("sendButton");
  send.disabled = true;
  send.textContent = "发送中";
  try {
    if (pendingImage) {
      const response = await fetch("/api/inbox/send-image", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          instance:currentInstance,
          phone:currentPhone,
          image:pendingImage.dataUrl,
          caption:body,
        }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "发图失败");
      pendingImage = null;
      $("imagePreview")?.classList.add("hidden");
    } else {
      const response = await fetch("/api/inbox/send", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ instance:currentInstance, phone:currentPhone, text:body }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "发送失败");
    }
    textarea.value = "";
    if (newContactAwaitingFirstSend?.phone === currentPhone) newContactAwaitingFirstSend = null;
    resizeComposer(textarea);
    await openThread(currentPhone, { refresh:true });
    await loadThreads({ silent:true });
  } catch (error) {
    alert(error.message);
  } finally {
    send.disabled = false;
    send.textContent = "发送";
  }
}

function openLightbox(src) {
  let box = $("lightbox");
  if (!box) {
    box = document.createElement("div");
    box.id = "lightbox";
    box.className = "lightbox";
    box.innerHTML = "<img alt=''>";
    box.addEventListener("click", () => box.classList.add("hidden"));
    document.body.appendChild(box);
  }
  box.querySelector("img").src = src;
  box.classList.remove("hidden");
}

renderThreadEmpty();
loadInboxCapabilities().then(loadNumbers);
setInterval(async () => {
  if (!currentInstance) return;
  await loadThreads({ silent:true });
  if (currentPhone) await openThread(currentPhone, { refresh:true });
}, 15000);
</script>
