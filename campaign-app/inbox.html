<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Room · Mamba</title>
<style>
  :root {
    --bg:#101310;
    --panel:#171b18;
    --panel-2:#1d221e;
    --panel-3:#242b26;
    --line:#303832;
    --line-strong:#465148;
    --text:#eef3ef;
    --muted:#a2aca5;
    --dim:#737e76;
    --green:#39d779;
    --green-soft:#173d28;
    --amber:#f3b84b;
    --amber-soft:#382b16;
    --blue:#58bfe7;
    --blue-soft:#153442;
    --red:#f17b7b;
    --purple:#8d7cf2;
    --purple-soft:#221d3d;
  }

  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    font-size:14px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  button, input, textarea { font:inherit; }
  button { letter-spacing:0; }

  .app-head {
    min-height:64px;
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:13px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:#131713;
  }
  .back-btn, .icon-btn {
    min-width:38px;
    height:38px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
  }
  .back-btn {
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:0 11px;
    white-space:nowrap;
  }
  .back-btn:hover, .icon-btn:hover { border-color:var(--line-strong); background:var(--panel-3); }
  .title-wrap { min-width:0; }
  .title-wrap h1 { margin:0; font-size:17px; letter-spacing:0; }
  .title-wrap p { margin:3px 0 0; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live-state { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; white-space:nowrap; }
  .live-state i { width:8px; height:8px; border-radius:50%; background:var(--green); }

  .number-bar {
    min-height:47px;
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:7px 14px 0;
    border-bottom:1px solid var(--line);
    background:#131713;
    overflow-x:auto;
  }
  .tab {
    min-height:39px;
    padding:8px 13px;
    border:1px solid transparent;
    border-bottom:0;
    border-radius:7px 7px 0 0;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
  }
  .tab.active { color:var(--text); background:var(--panel); border-color:var(--line); }
  .tab .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:7px; }
  .tab .cnt { color:var(--dim); margin-left:5px; font-size:11px; }

  .mobile-switch {
    display:none;
    min-height:45px;
    padding:6px;
    gap:5px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .mobile-switch button {
    flex:1;
    min-height:32px;
    border:1px solid transparent;
    border-radius:6px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
  }
  .mobile-switch button.on { color:var(--text); background:var(--panel-3); border-color:var(--line); }

  .workspace {
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(235px,1.6fr) minmax(500px,7fr) minmax(330px,3.2fr);
    gap:12px;
    padding:12px;
    background:var(--bg);
  }
  .panel {
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
  }
  .reply-panel { background:var(--bg); }
  .ai-panel { background:#181713; }

  .panel-head {
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
  }
  .panel-title { min-width:0; }
  .panel-title h2 { margin:0; font-size:13.5px; letter-spacing:0; }
  .panel-title p { margin:3px 0 0; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .head-tool {
    flex:0 0 auto;
    min-width:32px;
    height:30px;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel-2);
    color:var(--muted);
    cursor:pointer;
    font-size:12px;
  }
  .head-tool:hover { color:var(--text); border-color:var(--line-strong); background:var(--panel-3); }
  .head-tool.on { color:var(--amber); border-color:#6e5424; background:var(--amber-soft); }

  .thread-head { align-items:center; }
  .thread-avatar {
    flex:0 0 auto;
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--green-soft);
    color:var(--green);
    font-size:12px;
    font-weight:800;
  }
  .thread-head .panel-title { flex:1; }
  .thread-chips { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .chip {
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 9px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel-2);
    color:var(--muted);
    font-size:10px;
    font-weight:750;
    white-space:nowrap;
  }
  button.chip { cursor:pointer; }
  button.chip:hover { color:var(--text); border-color:var(--line-strong); }
  .chip.amber { color:var(--amber); border-color:#6e5424; background:var(--amber-soft); }
  .chip.green { color:var(--green); border-color:#356348; background:var(--green-soft); }
  .chip.blue { color:var(--blue); border-color:#31596a; background:var(--blue-soft); }
  .chip.red { color:var(--red); border-color:#754141; background:#2b1919; }
  .contact-card {
    display:grid;
    gap:6px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    font-size:10.5px;
  }
  .contact-card.hidden { display:none; }
  .contact-card div { display:grid; grid-template-columns:78px minmax(0,1fr); gap:8px; }
  .contact-card span { color:var(--dim); font-weight:700; }
  .contact-card strong { font-weight:700; overflow-wrap:anywhere; }

  .customer-nav {
    flex:1;
    min-height:0;
    overflow-y:auto;
    background:var(--panel);
  }
  .list-search { position:sticky; top:0; z-index:2; padding:9px; background:var(--panel); border-bottom:1px solid var(--line); }
  .list-search input {
    width:100%;
    height:36px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel-2);
    color:var(--text);
    outline:none;
  }
  .list-search input:focus { border-color:var(--amber); }
  .list-search-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; }
  .new-contact-button {
    min-width:38px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--amber-soft);
    color:var(--amber);
    cursor:pointer;
    font-weight:800;
  }
  .new-contact-form { display:grid; gap:7px; margin-top:8px; padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); }
  .new-contact-form.hidden { display:none; }
  .new-contact-form input, .new-contact-form select, .new-contact-form textarea {
    height:34px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--bg);
    color:var(--text);
  }
  .new-contact-form textarea { height:54px; resize:vertical; }
  .new-contact-project.hidden { display:none; }
  .new-contact-actions { display:grid; grid-template-columns:1fr auto; gap:6px; }
  .new-contact-actions button { min-height:32px; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-weight:750; }
  .new-contact-start { background:var(--green-soft); color:var(--green); }
  .new-contact-cancel { background:transparent; color:var(--muted); }
  .new-contact-note { color:var(--dim); font-size:9px; line-height:1.4; }
  .new-contact-error { color:var(--red); font-size:9.5px; }
  .list-filters { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .list-filters button {
    min-height:28px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:11px;
    font-weight:700;
  }
  .list-filters button:hover { color:var(--text); border-color:var(--line-strong); }
  .list-filters button.on { color:var(--amber); background:var(--amber-soft); border-color:#6e5424; }
  .filter-count { margin-left:5px; color:var(--dim); font-size:9px; }
  .list-filters button.on .filter-count { color:var(--amber); opacity:.8; }
  .customer-row {
    width:100%;
    min-height:68px;
    display:grid;
    grid-template-columns:30px minmax(0,1fr);
    align-items:center;
    gap:8px;
    padding:8px 9px;
    border:0;
    border-bottom:1px solid var(--line);
    border-left:3px solid transparent;
    background:transparent;
    color:var(--text);
    text-align:left;
    cursor:pointer;
  }
  .customer-row:hover { background:var(--panel-2); }
  .customer-row.active { background:var(--panel-3); border-left-color:var(--amber); }
  .customer-row.pending .avatar { color:var(--amber); background:var(--amber-soft); }
  .avatar {
    width:28px;
    height:28px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--blue-soft);
    color:var(--blue);
    font-size:10px;
    font-weight:800;
  }
  .customer-main { min-width:0; }
  .customer-name { display:block; font-size:12.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .customer-phone { display:block; margin-top:3px; color:var(--dim); font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .customer-status { display:flex; align-items:center; gap:5px; margin-top:4px; color:var(--dim); font-size:9px; }
  .pending-mark { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--amber); }
  .followup-chip {
    display:block;
    width:fit-content;
    min-width:0;
    max-width:100%;
    padding:2px 5px;
    border-radius:4px;
    background:var(--panel-3);
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .followup-chip.overdue { color:var(--red); background:#3a2020; }
  .followup-chip.today { color:var(--amber); background:var(--amber-soft); }
  .followup-chip.later { color:var(--blue); background:var(--blue-soft); }
  body[data-list-density="compact"] .customer-row { min-height:52px; }
  body[data-list-density="compact"] .followup-chip { display:none; }
  .list-empty, .feed-empty {
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--dim);
    font-size:12px;
    text-align:center;
    line-height:1.5;
  }

  .feed-label {
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    color:var(--muted);
    font-size:10.5px;
    font-weight:700;
  }
  .feed-count { color:var(--dim); font-weight:600; }
  .message-feed {
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:16px;
  }
  .day-sep {
    align-self:center;
    margin:10px 0 4px;
    padding:3px 11px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel-2);
    color:var(--muted);
    font-size:9.5px;
    font-weight:700;
    text-align:center;
  }
  .day-sep:first-child { margin-top:0; }
  .msg-row {
    display:flex;
    flex-direction:column;
    gap:4px;
    max-width:76%;
    min-width:0;
  }
  .msg-row.inbound { align-self:flex-start; align-items:flex-start; }
  .msg-row.outbound { align-self:flex-end; align-items:flex-end; }
  .entry {
    width:fit-content;
    min-width:130px;
    max-width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel-2);
    line-height:1.45;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .entry-text { white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg-row.inbound .entry { border-bottom-left-radius:4px; }
  .msg-row.outbound .entry { border-color:#285039; border-bottom-right-radius:4px; background:#17291e; }
  .msg-row.flash .entry { border-color:var(--amber); box-shadow:0 0 0 2px rgba(243,184,75,.22); }
  .entry-meta {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    margin-top:6px;
    color:var(--dim);
    font-size:9.5px;
  }
  .entry-time { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .entry-tag {
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:0 3px;
    color:var(--dim);
    font-size:9.5px;
    font-weight:700;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .entry-tag.auto { color:var(--blue); }
  .entry-tag.manual { color:var(--green); }
  .entry-tag.ai { color:var(--purple); }
  .delivery-mark { font-weight:800; letter-spacing:-2px; color:#91a0ae; cursor:help; }
  .delivery-mark.delivered { color:#b6c2cc; }
  .delivery-mark.read { color:#55b7ff; }
  .delivery-mark.failed { color:var(--red); letter-spacing:0; }
  .media-card {
    width:min(270px,100%);
    min-height:64px;
    display:grid;
    grid-template-columns:42px minmax(0,1fr) 26px;
    align-items:center;
    gap:9px;
    padding:8px;
    border:1px solid var(--line-strong);
    border-radius:9px;
    background:#1b201d;
    color:var(--text);
    cursor:pointer;
    text-align:left;
  }
  .media-card:hover { border-color:#416153; background:#1e2722; }
  .media-card:disabled { cursor:wait; opacity:.75; }
  .media-card.error { border-color:#704141; }
  .media-icon {
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:7px;
    background:var(--blue-soft);
    color:var(--blue);
    font-size:17px;
  }
  .media-card[data-media-kind="video"] .media-icon { background:#28223b; color:#b9a7ff; }
  .media-card[data-media-kind="document"] .media-icon { background:var(--amber-soft); color:var(--amber); }
  .media-copy { min-width:0; }
  .media-copy strong { display:block; font-size:11px; }
  .media-copy small { display:block; margin-top:3px; color:var(--dim); font-size:9px; line-height:1.35; }
  .media-open {
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--panel-3);
    color:var(--muted);
    font-size:10px;
  }
  .media-caption { margin-top:7px; white-space:pre-wrap; }
  .media-preview {
    width:min(290px,100%);
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:9px;
    background:#0c100e;
  }
  .message-image {
    display:block;
    width:100%;
    max-height:340px;
    object-fit:cover;
    cursor:zoom-in;
  }
  .message-video {
    display:block;
    width:100%;
    max-height:360px;
    background:#080a09;
  }
  .media-document {
    min-height:58px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    color:var(--blue);
    text-decoration:none;
  }

  .composer-dock { border-top:1px solid var(--line); background:var(--panel); }
  .image-preview {
    min-height:64px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
  }
  .image-preview.hidden { display:none; }
  .image-preview img { width:48px; height:48px; object-fit:cover; border-radius:6px; }
  .image-preview span { min-width:0; flex:1; color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .image-preview button { border:0; background:transparent; color:var(--red); cursor:pointer; font-size:18px; }
  .composer { display:grid; grid-template-columns:38px minmax(0,1fr) 62px; align-items:end; gap:8px; padding:10px; }
  .composer textarea {
    width:100%;
    min-height:40px;
    max-height:130px;
    resize:none;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:7px;
    outline:none;
    background:var(--panel-2);
    color:var(--text);
    line-height:1.4;
  }
  .composer textarea:focus { border-color:var(--green); }
  .composer button {
    height:40px;
    border:1px solid var(--line);
    border-radius:7px;
    cursor:pointer;
  }
  .attach-btn { background:var(--panel-3); color:var(--text); font-size:18px; }
  .send-btn { background:var(--green); border-color:var(--green) !important; color:#07140b; font-weight:800; }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  .stopped-note { padding:14px; color:var(--red); text-align:center; font-size:11.5px; }

  .side-scroll { flex:1; min-height:0; overflow-y:auto; }
  .ai-panel.collapsed { align-self:start; }
  .ai-panel.collapsed .side-scroll { display:none; }
  .followup-content { background:#171a17; }
  .ai-content { min-height:0; }
  .ai-empty { min-height:180px; display:grid; place-items:center; padding:14px; color:var(--dim); text-align:center; font-size:12px; line-height:1.5; }

  .side-block { padding:13px 14px; border-bottom:1px dashed var(--line); }
  .side-block.last { border-bottom:0; }
  .block-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
  .block-title { display:flex; align-items:center; gap:6px; min-width:0; font-size:11px; font-weight:800; }
  .block-title .ico { flex:0 0 auto; font-size:12px; }
  .block-link {
    flex:0 0 auto;
    padding:0;
    border:0;
    background:transparent;
    color:var(--blue);
    font-size:10px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
  }
  .block-link:hover { text-decoration:underline; }
  .block-hint { margin:0 0 9px; color:var(--dim); font-size:9.5px; line-height:1.45; }
  .status-line {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:9px;
    color:var(--dim);
    font-size:9px;
    font-weight:850;
    letter-spacing:.07em;
    text-transform:uppercase;
  }
  .status-line b { color:var(--muted); }
  .status-line b.overdue { color:var(--red); }
  .status-line b.today { color:var(--amber); }
  .status-line b.later { color:var(--blue); }
  .quote-card {
    padding:9px 11px;
    border:1px solid var(--line);
    border-left:2px solid var(--amber);
    border-radius:0 8px 8px 0;
    background:#1e1b14;
    color:#f0e2c4;
    font-size:11px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .quote-meta { margin-top:7px; color:var(--dim); font-size:9px; }
  .summary-meta { margin:0 0 9px; color:var(--dim); font-size:9.5px; }
  .summary-list { display:grid; gap:6px; }
  .summary-item {
    width:100%;
    display:grid;
    grid-template-columns:66px minmax(0,1fr);
    align-items:start;
    gap:8px;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel-2);
    color:var(--text);
    text-align:left;
    cursor:pointer;
  }
  .summary-item:hover { border-color:var(--line-strong); background:var(--panel-3); }
  .summary-item b { color:var(--blue); font-size:9.5px; font-weight:850; line-height:1.5; }
  .summary-item span { color:var(--muted); font-size:10.5px; line-height:1.5; overflow-wrap:anywhere; }
  .summary-empty { color:var(--dim); font-size:10.5px; line-height:1.55; }
  .summary-source { margin-top:9px; color:var(--dim); font-size:9px; line-height:1.45; }
  .advice-box {
    margin-top:9px;
    padding:9px 11px;
    border:1px solid #6e5424;
    border-radius:8px;
    background:var(--amber-soft);

<body data-mobile-pane="customer">

        <button class="icon-btn mobile-only" id="threadBack" type="button" title="返回客户" aria-label="返回客户">←</button>
        <span class="thread-avatar" id="threadAvatar" aria-hidden="true">·</span>
        <div class="panel-title"><h2 id="replyTitle">Conversation</h2><p id="replySubtitle">选择客户后开始</p></div>

        <div class="ai-content" id="aiContent"><div class="ai-empty">选择客户后查看建议</div></div>
      </div>

<script>
const $ = (id) => document.getElementById(id);
const MEDIA_RE = /^\[(image|video|document|sticker)\]$/;

let numbers = [];
let currentInstance = "";
let threads = [];
let currentPhone = "";
let searchText = "";
let listFilter = "all";
let threadsSig = "";
let currentThreadSig = "";
let pendingImage = null;
let newContactEnabled = false;
let newContactOpen = false;
let newContactAwaitingFirstSend = null;
let newContactLeadTypes = [];
let newContactProjects = [];
let followUpRecords = [];
let followUpByPhone = new Map();
let followUpLoadError = "";
let currentThreadData = null;
let followUpSelection = new Map();
let mediaObserver = null;
let contactCardOpen = false;
let followUpFormOpen = false;
let toneRowOpen = false;
let listDensity = "comfortable";

async function jget(url) {
  const response = await fetch(url, { cache:"no-store" });
  return response.json();
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;",
  })[char]);
}

function initials(name) {
  return String(name || "?").trim().split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
}

function relTime(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  const now = new Date();
  if (date.toDateString() === now.toDateString()) {
    return date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
  }
  const days = Math.max(1, Math.round((now - date) / 86400000));
  if (days === 1) return "昨天";
  if (days < 7) return `${days} 天前`;
  return date.toLocaleDateString([], { month:"2-digit", day:"2-digit" });
}

function phoneKey(value) {
  let digits = String(value || "").replace(/\D/g, "");
  if (digits.startsWith("0")) digits = `60${digits.slice(1)}`;
  return digits;
}

function followUpsForPhone(phone) {
  return followUpByPhone.get(phoneKey(phone)) || [];
}

function primaryFollowUp(phone) {
  return followUpsForPhone(phone)[0] || null;
}

function followUpTone(record) {
  if (!record) return "unplanned";
  if (record.overdue) return "overdue";
  if (record.dueToday) return "today";
  if (record.followUpAt) return "later";
  return "unplanned";
}

function followUpWhen(record) {
  if (!record?.followUpAt) return "未安排时间";
  const date = new Date(record.followUpAt);
  if (Number.isNaN(date.getTime())) return "未安排时间";
  const day = date.toLocaleDateString([], { month:"2-digit", day:"2-digit" });
  const time = date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
  if (record.overdue) return `已逾期 · ${day} ${time}`;
  if (record.dueToday) return `今天 · ${time}`;
  return `${day} ${time}`;
}

async function loadFollowUpRecords() {
  try {
    const data = await jget("/api/follow-up");
    if (!data?.ok) throw new Error(data?.error || "Follow-up 读取失败");
    followUpRecords = data.records || [];
    const grouped = new Map();
    for (const record of followUpRecords) {
      const key = phoneKey(record.phone);
      if (!key) continue;
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(record);
    }
    followUpByPhone = grouped;
    followUpLoadError = "";
  } catch (error) {
    followUpLoadError = error.message;
  }
}

function threadMatchesFilter(thread, filter) {
  const record = primaryFollowUp(thread.phone);
  if (filter === "pending") return thread.lastDirection === "inbound";
  if (filter === "overdue") return record?.overdue === true;
  if (filter === "today") return record?.dueToday === true && record?.overdue !== true;
  if (filter === "scheduled") return Boolean(record?.followUpAt) && !record.overdue && !record.dueToday;
  if (filter === "unplanned") return !record?.followUpAt;
  return true;
}

function filterCount(filter) {
  return threads.filter((thread) => threadMatchesFilter(thread, filter)).length;
}

function payloadOf(message) {
  try { return JSON.parse(message?.payloadJson || "{}"); }
  catch { return {}; }
}

function goBack() {
  try {
    const ref = document.referrer ? new URL(document.referrer) : null;
    if (ref && ref.origin === location.origin && ref.pathname !== location.pathname) {
      history.back();
      return;
    }
  } catch {}
  location.href = "/control-center";
}

function setMobilePane(pane) {
  document.body.dataset.mobilePane = pane;
  document.querySelectorAll(".mobile-switch button").forEach((button) => {
    button.classList.toggle("on", button.dataset.pane === pane);
  });
}

$("pageBack").addEventListener("click", goBack);
$("threadBack").addEventListener("click", () => setMobilePane("customer"));
document.querySelectorAll(".mobile-switch button").forEach((button) => {
  button.addEventListener("click", () => setMobilePane(button.dataset.pane));
});

$("densityToggle").addEventListener("click", () => {
  listDensity = listDensity === "compact" ? "comfortable" : "compact";
  document.body.dataset.listDensity = listDensity;
  $("densityToggle").classList.toggle("on", listDensity === "compact");
});

$("sideCollapse").addEventListener("click", () => {
  const panel = $("aiPanel");
  const collapsed = panel.classList.toggle("collapsed");
  const button = $("sideCollapse");
  button.textContent = collapsed ? "⌄" : "⌃";
  button.title = collapsed ? "展开工作台" : "收起工作台";
  button.setAttribute("aria-expanded", collapsed ? "false" : "true");
});

async function loadNumbers() {
  const data = await jget("/api/inbox/numbers").catch(() => ({ numbers:[] }));
  numbers = data.numbers || [];
  if (!numbers.length) {
    $("tabs").innerHTML = '<span class="list-empty">没有连接中的号码</span>';
    $("customerNav").innerHTML = '<div class="list-empty">请先到 Settings 连接 WhatsApp</div>';
    return;
  }
  currentInstance = numbers[0].instance;
  renderTabs();
  await loadThreads();
}

async function loadInboxCapabilities() {
  const data = await jget("/api/inbox/capabilities").catch(() => null);
  newContactEnabled = data?.capabilities?.newContact === true;
  newContactLeadTypes = data?.leadTypes || [];
  newContactProjects = data?.projects || [];
}

// Tab 上显示的是「哪一支电话」，不是 Evolution 的标签（wa_01 这种）。
// 号码读不到时才退回标签名，不然 tab 会变空的。
function prettyPhone(value) {
  const digits = String(value || "").replace(/\D/g, "");
  if (!digits) return "";
  if (digits.startsWith("60")) {
    const local = digits.slice(2);
    if (local.length === 9) return `+60 ${local.slice(0, 2)}-${local.slice(2, 5)} ${local.slice(5)}`;
    if (local.length === 10) return `+60 ${local.slice(0, 2)}-${local.slice(2, 6)} ${local.slice(6)}`;
  }
  return `+${digits}`;
}

// 「用哪支号码」在确认发送时最重要，所以号码在前、Evolution 标签在后。
function instanceLabel(instance) {
  const name = String(instance || "");
  const phone = prettyPhone(numbers.find((item) => item.instance === name)?.number);
  if (!name) return phone || "-";
  return phone ? `${phone} · ${name}` : name;
}

function renderTabs() {
  $("tabs").innerHTML = numbers.map((number) => {
    const phone = prettyPhone(number.number);
    return `
    <button class="tab ${number.instance === currentInstance ? "active" : ""}" type="button"
      data-inst="${esc(number.instance)}"
      title="${esc(phone ? `${phone} · ${number.instance}` : number.instance)}">
      <span class="dot"></span>${esc(phone || number.instance)}
      <span class="cnt" data-cnt="${esc(number.instance)}"></span>
    </button>`;
  }).join("");
  document.querySelectorAll("#tabs .tab").forEach((tab) => {
    tab.addEventListener("click", async () => {
      currentInstance = tab.dataset.inst;
      currentPhone = "";
      currentThreadSig = "";
      pendingImage = null;
      newContactOpen = false;
      newContactAwaitingFirstSend = null;
      renderTabs();
      renderThreadEmpty();
      await loadThreads();
    });
  });
}

async function loadThreads({ silent = false } = {}) {
  if (!silent) {
    $("customerNav").innerHTML = '<div class="list-empty">读取客户中</div>';
    threadsSig = "";
  }
  const [data] = await Promise.all([
    jget(`/api/inbox/threads?instance=${encodeURIComponent(currentInstance)}&filter=all`)
      .catch(() => ({ threads:[] })),
    loadFollowUpRecords(),
  ]);
  threads = data.threads || [];
  const count = document.querySelector(`[data-cnt="${CSS.escape(currentInstance)}"]`);
  if (count) count.textContent = threads.length || "";
  const followUpSignature = followUpRecords
    .map((record) => `${record.id}:${record.followUpAt || ""}:${record.nextAction || ""}:${record.priority || ""}`)
    .join("|");
  const signature = `${listFilter}|${threads.map((thread) => `${thread.phone}:${thread.lastAt}:${thread.replyCount}`).join("|")}::${searchText}::${followUpSignature}`;
  if (silent && signature === threadsSig) return;
  if (silent && document.activeElement === $("listSearch")) return;
  threadsSig = signature;
  renderList();
}

function renderList() {
  const query = searchText.trim().toLowerCase();
  const filtered = threads.filter((thread) => threadMatchesFilter(thread, listFilter));
  const shown = query
    ? filtered.filter((thread) => (thread.name || "").toLowerCase().includes(query) || (thread.phone || "").includes(query))
    : filtered;
  const filters = [
    ["all", "全部"],
    ["pending", "待回复"],
    ["overdue", "已逾期"],
    ["today", "今天"],
    ["scheduled", "已安排"],
    ["unplanned", "未安排"],
  ];
  const search = `
    <div class="list-search">
      <div class="list-search-row">
        <input id="listSearch" type="search" placeholder="搜索名字或号码" value="${esc(searchText)}" aria-label="搜索客户">
        ${newContactEnabled ? '<button class="new-contact-button" id="newContactButton" type="button" title="新增号码" aria-label="新增号码">＋</button>' : ""}
      </div>
      ${newContactEnabled ? `
        <form class="new-contact-form ${newContactOpen ? "" : "hidden"}" id="newContactForm">
          <input id="newContactPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="电话号码，例如 0123456789" aria-label="新客户电话号码">
          <input id="newContactName" type="text" autocomplete="off" placeholder="名字（可不填）" aria-label="新客户名字">

  $("customerListSubtitle").textContent = `${shown.length}/${threads.length} 位 · 逾期 ${filterCount("overdue")} · 今天 ${filterCount("today")}`;

  const input = $("listSearch");
  if (input) {
    input.addEventListener("input", (event) => {
      searchText = event.target.value;
      const caret = input.selectionStart;
      renderList();
      const next = $("listSearch");
      if (next) {

async function startNewContact(event) {
  event.preventDefault();
  const phoneInput = $("newContactPhone");
  const nameInput = $("newContactName");
  const typeInput = $("newContactLeadType");
  const projectInput = $("newContactProject");
  const noteInput = $("newContactNote");
  const errorBox = $("newContactError");
  const submit = event.currentTarget.querySelector('button[type="submit"]');
  errorBox.textContent = "";
  submit.disabled = true;
  submit.textContent = "建立中";
  try {
    const response = await fetch("/api/inbox/new-contact", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        instance:currentInstance,
        phone:phoneInput.value,
        name:nameInput.value,
        leadType:typeInput.value,
        projectId:projectInput.value,
        note:noteInput.value,
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "新增号码失败");
    newContactOpen = false;
    newContactAwaitingFirstSend = {
      phone:data.contact.phone,
      typeLabel:data.contact.typeLabel || typeInput.selectedOptions[0]?.textContent || "Customer",
    };
    await openThread(data.contact.phone);
    renderList();
    $("composerText")?.focus();
    if (data.warning) window.alert(data.warning);
  } catch (error) {
    errorBox.textContent = error.message;
    submit.disabled = false;
    submit.textContent = "开始聊天";
  }
}

async function openThread(phone, { refresh = false } = {}) {
  const switchingCustomer = currentPhone && currentPhone !== phone;
  if (switchingCustomer) pendingImage = null;
  currentPhone = phone;
  document.querySelectorAll(".customer-row").forEach((row) => {
    row.classList.toggle("active", row.dataset.phone === phone);
  });
  if (!refresh) {
    currentThreadSig = "";
    renderLoadingThread();
    setMobilePane("reply");
  }
  const data = await jget(`/api/inbox/thread?phone=${encodeURIComponent(phone)}`).catch(() => null);
  if (!data || !data.ok) {
    if (!refresh) {
      $("conversationMessages").innerHTML = '<div class="feed-empty">对话读取失败</div>';
      $("aiContent").innerHTML = '<div class="ai-empty">建议读取失败</div>';
    }
    return;
  }

  const messages = data.messages || [];
  const last = messages.at(-1);
  const latestInbound = [...messages].reverse().find((message) => message.direction === "inbound");
  const followUp = primaryFollowUp(phone);
  const signature = `${messages.length}::${last?.sentAt || ""}::${last?.text || ""}::${latestInbound?.payloadJson || ""}::${data.contact?.dispositionStatus || ""}::${followUp?.id || ""}:${followUp?.followUpAt || ""}:${followUp?.nextAction || ""}:${followUp?.priority || ""}`;
  if (refresh && signature === currentThreadSig) return;

  const draft = $("composerText")?.value || "";
  const hadFocus = document.activeElement === $("composerText");
  currentThreadSig = signature;
  currentThreadData = { contact:data.contact, messages };
  renderThread(data.contact, messages);

  const textarea = $("composerText");
  if (textarea && draft) {
    textarea.value = draft;
    resizeComposer(textarea);
    if (hadFocus) {
      textarea.focus();
      textarea.setSelectionRange(draft.length, draft.length);
    }
  }
  if (pendingImage) showImagePreview();
}

// 气泡下面那行小字：这条回复是谁发的 —— 人工、Sales Brain，还是 blast flow。
function sourceTag(message) {
  if (message.direction !== "outbound") return null;
  const source = String(message.source || "").toLowerCase();
  const flow = String(message.flowTopic || "").trim();
  if (source === "manual") return { tone:"manual", label:"人工发送" };
  if (source === "brain") return { tone:"ai", label:"AI 回复" };
  const detail = flow && !/^manual_/.test(flow) ? flow : "";
  return { tone:"auto", label:detail ? `自动发送 · ${detail}` : "自动发送" };
}

function dayLabel(date) {
  const now = new Date();
  const yesterday = new Date(now.getTime() - 86400000);
  if (date.toDateString() === now.toDateString()) return "今天";
  if (date.toDateString() === yesterday.toDateString()) return "昨天";
  return date.toLocaleDateString([], { year:"numeric", month:"2-digit", day:"2-digit" });
}

function deliveryMark(message) {
  if (message?.direction !== "outbound") return "";
  const status = String(payloadOf(message).deliveryStatus || "").toUpperCase();
  const marks = {
    PENDING: ["○", "正在等待 WhatsApp 接收", ""],
    ERROR: ["!", "发送失败；请检查号码或连接，不能据此直接判定被封锁", "failed"],
    SERVER_ACK: ["✓", "WhatsApp 服务器已接收（单勾）", ""],
    DELIVERY_ACK: ["✓✓", "已送达客户装置（双勾）", "delivered"],
    READ: ["✓✓", "客户已读", "read"],
    PLAYED: ["✓✓", "客户已播放", "read"],
  };
  const item = marks[status];
  if (!item) return "";
  return `<span class="delivery-mark ${item[2]}" title="${esc(item[1])}" aria-label="${esc(item[1])}">${item[0]}</span>`;
}

function messageContent(message) {
  const raw = (message.text || "").trim();
  const payload = payloadOf(message);
  const markerKind = MEDIA_RE.test(raw) ? raw.replace(/[\[\]]/g, "") : "";
  const kind = String(payload.mediaKind || markerKind || "").toLowerCase();
  if (!["image", "video", "document", "sticker"].includes(kind)) return esc(message.text || "");
  const labels = {
    image: ["照片", "靠近画面时自动加载", "▧"],
    video: ["影片", "点击后加载播放", "▶"],
    document: ["文件", "点击后读取", "≡"],
    sticker: ["贴图", "靠近画面时自动加载", "◇"],
  };
  const [label, hint, icon] = labels[kind];
  const placeholder = MEDIA_RE.test(raw) || raw === "[已发送图片]";
  const caption = placeholder ? "" : raw;
  return `
    <button class="media-card" type="button"
      data-media-id="${esc(message.id || "")}"
      data-media-kind="${esc(kind)}"
      data-media-direction="${esc(message.direction || "inbound")}"
      data-media-file="${esc(payload.mediaFileName || "")}"
      aria-label="加载${esc(label)}">
      <span class="media-icon">${icon}</span>
      <span class="media-copy"><strong>${esc(label)}</strong><small>${esc(hint)}</small></span>
      <span class="media-open">${kind === "video" ? "▶" : "↗"}</span>
    </button>
    ${caption ? `<div class="media-caption">${esc(caption)}</div>` : ""}`.trim();
}

function conversationMarkup(messages) {
  const selected = messages.filter((message) => ["inbound", "outbound"].includes(message.direction));
  if (!selected.length) return '<div class="feed-empty">暂无消息</div>';
  let lastDay = "";
  const items = [];
  for (const message of selected) {
    const direction = message.direction === "inbound" ? "inbound" : "outbound";
    const date = new Date(message.sentAt);
    const day = dayLabel(date);
    if (day !== lastDay) {
      items.push(`<div class="day-sep">${esc(day)}</div>`);
      lastDay = day;
    }
    const time = date.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
    const tag = sourceTag(message);
    items.push(`
      <div class="msg-row ${direction}" data-msg="${esc(message.id || "")}">
        <article class="entry">
          <div class="entry-text">${messageContent(message)}</div>
          <footer class="entry-meta">
            <span class="entry-time">${deliveryMark(message)}<time>${esc(time)}</time></span>
          </footer>
        </article>
        ${tag ? `<span class="entry-tag ${tag.tone}">${esc(tag.label)}</span>` : ""}
      </div>`);
  }
  return items.join("");
}

function signalClass(signal) {
  const value = String(signal || "").toUpperCase();
  if (value === "GREEN") return "green";
  if (value === "RED") return "red";
  if (value === "YELLOW" || value === "AMBER") return "amber";
  return "";
}

function intentClass(category, signal) {
  const value = `${category || ""} ${signal || ""}`.trim().toLowerCase();
  if (/do not contact|\bstop\b|blocked|red/.test(value)) return "intent-stop";
  if (/not interested|no interest|reject|不感兴趣|没兴趣/.test(value)) return "intent-not-interested";
  if (/follow.?up|appointment|blue/.test(value)) return "intent-follow-up";
  if (/interested|warm|positive|green/.test(value)) return "intent-positive";
  return "";
}

function suggestedDisposition(category) {
  const value = String(category || "").trim().toLowerCase();
  return /not interested|no interest|reject|不感兴趣|没兴趣/.test(value)
    ? "NOT_INTERESTED"
    : "";
}

function toDateTimeLocal(value) {
  const date = new Date(value || "");
  if (Number.isNaN(date.getTime())) return "";
  const pad = (part) => String(part).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function presetFollowUpTime(kind) {
  const date = new Date();
  date.setSeconds(0, 0);
  if (kind === "today") {
    if (date.getHours() < 18) date.setHours(18, 0, 0, 0);
    else {
      date.setHours(date.getHours() + 2, 0, 0, 0);
    }
  } else {
    const days = kind === "tomorrow" ? 1 : kind === "three_days" ? 3 : 7;
    date.setDate(date.getDate() + days);
    date.setHours(10, 0, 0, 0);
  }
  return toDateTimeLocal(date);
}

function actionForRecord(record) {
  const action = String(record?.nextAction || "").toLowerCase();
  if (action.includes("call")) return "call";
  if (action.includes("price")) return "send_price";
  if (action.includes("appointment") || action.includes("viewing") || action.includes("book")) return "book_appointment";
  return "follow_up";
}

function selectedFollowUp(contact) {
  const records = followUpsForPhone(contact?.phone);
  const selectedId = followUpSelection.get(phoneKey(contact?.phone));
  return records.find((record) => record.id === selectedId) || records[0] || null;
}

async function saveChatFollowUp(actionOverride = "") {
  const contact = currentThreadData?.contact;
  const record = contact ? selectedFollowUp(contact) : null;
  const feedback = $("followUpFeedback");
  if (!contact || !record?.id || !feedback) return;
  const action = actionOverride || $("followUpAction")?.value || "follow_up";
  if (action === "done" && !window.confirm(`确认 ${contact.name || contact.phone} 的 Follow-up 已完成？`)) return;

  const atInput = $("followUpAt");
  const selectedAt = atInput?.value || "";
  if (action !== "done" && !selectedAt) {
    feedback.textContent = "请选择提醒时间。";
    feedback.classList.add("error");
    atInput?.focus();
    return;
  }

  const buttons = [$("followUpSave"), $("followUpDone")].filter(Boolean);
  buttons.forEach((button) => { button.disabled = true; });
  feedback.classList.remove("error");
  feedback.textContent = action === "done" ? "正在完成…" : "正在保存…";
  try {
    const response = await fetch("/api/follow-up/action", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id:record.id,
        action,
        followUpAt:selectedAt ? new Date(selectedAt).toISOString() : "",
        priority:$("followUpPriority")?.value || "MED",
        note:$("followUpNote")?.value || "",
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Follow-up 保存失败");
    await loadFollowUpRecords();
    renderList();
    renderFollowUpPanel(contact);
    const nextFeedback = $("followUpFeedback");
    if (nextFeedback) nextFeedback.textContent = action === "done" ? "已完成，不会再出现在待跟进列表。" : "已保存，并同步到 Follow-Up Desk。";
  } catch (error) {
    feedback.textContent = error.message;
    feedback.classList.add("error");
    buttons.forEach((button) => { button.disabled = false; });
  }
}

// 客户自己说过的话里，销售最常要回头找的几件事。
// 纯本机关键词整理 —— 对话不会送出去，也不需要 API key。
const SUMMARY_BUCKETS = [
  { key:"预算", re:/(rm\s?[\d,.]+\s?(k|ribu|juta)?|budget|bajet|harga|price|loan|pinjaman|deposit|downpayment|\bdp\b|ansuran|installment|monthly|bulanan|预算|价格|月供)/i },
  { key:"地点", re:/(kepong|selayang|semenyih|batu caves|rawang|sentul|kajang|puchong|shah alam|area|kawasan|lokasi|location|dekat|jauh|地点|区域|附近|太远)/i },
  { key:"房型", re:/(landed|teres|terrace|banglo|bungalow|semi.?d|condo|apartment|rumah|bilik|bedroom|tingkat|unit|studio|房型|几房|排屋|公寓)/i },
  { key:"工作", re:/(kerja|work|office|company|bank negara|bank|gaji|salary|income|epf|kwsp|slip|business|工作|公司|收入)/i },
  { key:"时间", re:/(bila|when|bulan|month|tahun|year|next|nanti|sekarang|urgent|cepat|weekend|minggu|时间|什么时候|下个月)/i },
  { key:"顾虑", re:/(jauh|mahal|expensive|tak\s?sure|belum|susah|risau|takut|reject|blacklist|ccris|ctos|考虑|太贵|不方便|还没)/i },
];

function plainInbound(messages) {
  return messages.filter((message) => {
    if (message.direction !== "inbound") return false;
    const text = String(message.text || "").trim();
    return Boolean(text) && !MEDIA_RE.test(text);
  });
}

function snippet(text, limit = 96) {
  const flat = String(text || "").replace(/\s+/g, " ").trim();
  return flat.length > limit ? `${flat.slice(0, limit)}…` : flat;
}

function summarizeCustomer(messages) {
  const inbound = plainInbound(messages);
  const grouped = new Map();
  const remember = (key, message) => {
    const id = String(message.id || message.sentAt || "");
    if (!grouped.has(id)) grouped.set(id, { keys:[], text:snippet(message.text), id:message.id || "", at:message.sentAt });
    const entry = grouped.get(id);
    if (!entry.keys.includes(key)) entry.keys.push(key);
  };
  for (const bucket of SUMMARY_BUCKETS) {
    const hit = [...inbound].reverse().find((message) => bucket.re.test(message.text));
    if (hit) remember(bucket.key, hit);
  }
  const question = [...inbound].reverse().find((message) => /[?？]/.test(message.text));
  if (question) remember("提问", question);
  const facts = [...grouped.values()].sort((a, b) => String(a.at).localeCompare(String(b.at)));
  return {
    count:inbound.length,
    firstAt:inbound[0]?.sentAt || "",
    lastAt:inbound.at(-1)?.sentAt || "",
    facts,
  };
}

function summaryMarkup(summary) {
  if (!summary.count) {
    return '<div class="summary-empty">这个客户还没有发过文字消息，暂时没东西可以整理。</div>';
  }
  const meta = `共 ${summary.count} 条客户消息 · 首次 ${esc(relTime(summary.firstAt))} · 最近 ${esc(relTime(summary.lastAt))}`;
  const body = summary.facts.length
    ? `<div class="summary-list">${summary.facts.map((fact) => `
        <button class="summary-item" type="button" data-jump="${esc(fact.id)}" title="跳到这条消息">
          <b>${esc(fact.keys.slice(0, 2).join(" / "))}${fact.keys.length > 2 ? " +" : ""}</b><span>${esc(fact.text)}</span>
        </button>`).join("")}</div>`
    : '<div class="summary-empty">客户的消息里还看不出预算、地点或房型的偏好，先问清楚需求。</div>';
  return `<p class="summary-meta">${meta}</p>${body}
    <div class="summary-source">本机按关键词整理客户原话，点一条可以跳回对话；不是 AI 生成的结论，请自己核对。</div>`;
}

function nextStepNarrative(summary) {
  if (!summary.count) return "还没有客户消息，先确认这个号码是否正确。";
  const keys = summary.facts.flatMap((fact) => fact.keys).filter((key) => key !== "提问");
  const unique = [...new Set(keys)];
  const focus = unique.length ? `客户提到过 ${unique.join("、")}。` : "客户还没有说出明确偏好。";
  const asked = summary.facts.some((fact) => fact.keys.includes("提问")) ? "客户有问题在等答案。" : "";
  return `${focus}${asked} 最后一条客户消息在 ${relTime(summary.lastAt)}。`;
}

function applyTone(text, tone) {
  const base = String(text || "").trim();
  if (!base) return base;
  if (tone === "short") {
    const parts = base.split(/(?<=[.!?。！？])\s+/).filter(Boolean);
    return parts.length > 2 ? parts.slice(0, 2).join(" ") : base;
  }
  if (tone === "warm") {
    const withEmoji = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(base) ? base : `${base} 🙂`;
    return /^(hi|hai|hello|salam|selamat)/i.test(withEmoji) ? withEmoji : `Hi 👋 ${withEmoji}`;
  }
  return base
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
    .replace(/!+/g, ".")
    .replace(/\s{2,}/g, " ")
    .trim();
}

// 最新的一条客户消息，加上最近一条带 AI 判断的 payload。
// 顶栏 chip 和右边工作台必须看同一份判断，不然会对不上。
function intentPayload(messages) {
  const inbound = [...messages].reverse().filter((message) => message.direction === "inbound");
  const latestCustomer = inbound[0] || null;
  const carrier = inbound.find((message) => {
    const payload = payloadOf(message);
    return payload.suggestedReply || payload.category || payload.nextAction || payload.signal;
  }) || latestCustomer;
  return { latestCustomer, payload:payloadOf(carrier) };
}

function focusMessage(id) {
  const key = String(id || "");
  if (!key) return;
  const row = document.querySelector(`.msg-row[data-msg="${CSS.escape(key)}"]`);
  if (!row) return;
  setMobilePane("reply");
  row.scrollIntoView({ block:"center", behavior:"smooth" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1600);
}

async function applyConversationDisposition(disposition) {
  const contact = currentThreadData?.contact;
  const feedback = $("intentFeedback");
  const button = $("applySuggestedDisposition");
  if (!contact || !feedback || !button) return;
  if (!window.confirm(
    `确认把 ${contact.name || contact.phone} 列为 Not Interested？\n\n系统会停止自动 Flow，但不会加入全局 Do Not Contact。`
  )) return;

  button.disabled = true;
  button.textContent = "保存中";
  feedback.classList.remove("error");
  feedback.textContent = "正在先保存到本机…";
  try {
    const response = await fetch("/api/conversations/disposition", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        id:contact.dispositionId || "",
        disposition,
        phone:contact.phone,
        name:contact.name || "",
        project:contact.projectCode || "",
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Not Interested 保存失败");
    contact.dispositionStatus = data.disposition?.status || "Not Interested";
    renderAiPanel(contact, currentThreadData.messages || []);
    await loadFollowUpRecords();
    renderList();
  } catch (error) {
    feedback.textContent = error.message;
    feedback.classList.add("error");
    button.disabled = false;
    button.textContent = "列为 Not Interested";
  }
}

// 对话顶栏的状态 chip：AI 怎么分类、Follow-up 排了没有、有没有 STOP。

  const intentTone = intentClass(category, payload.signal);
  const categoryTone = intentTone === "intent-positive" ? "green"
    : intentTone === "intent-follow-up" ? "blue"
    : intentTone === "intent-stop" ? "red"
    : intentTone === "intent-not-interested" ? "amber"
    : "";
  const record = primaryFollowUp(contact.phone);
  const tone = followUpTone(record);
  const followUpChip = record
    ? { tone:tone === "unplanned" ? "" : tone === "overdue" ? "red" : tone === "today" ? "amber" : "blue", label:`Follow-up ${followUpWhen(record)}` }
    : { tone:"amber", label:"未建立 Follow-up" };

  $("threadChips").innerHTML = `
    ${contact.stopFlag ? '<span class="chip red">已 STOP</span>' : ""}
    <span class="chip ${categoryTone}">${esc(category)}</span>
    <span class="chip ${followUpChip.tone}">${esc(followUpChip.label)}</span>

}

  const inbound = messages.filter((message) => message.direction === "inbound");

function wireMediaButtons() {
  mediaObserver?.disconnect();
  mediaObserver = null;
  const buttons = [...document.querySelectorAll(".media-card")];
  buttons.forEach((button) => {
    button.addEventListener("click", () => loadMediaCard(button));
  });
  if (!("IntersectionObserver" in window)) return;
  mediaObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const button = entry.target;
      if (!["image", "sticker"].includes(button.dataset.mediaKind || "")) continue;
      mediaObserver.unobserve(button);
      loadMediaCard(button, { automatic:true });
    }
  }, {
    root:$("conversationMessages"),
    rootMargin:"160px 0px",
    threshold:0.01,
  });
  buttons
    .filter((button) => ["image", "sticker"].includes(button.dataset.mediaKind || ""))
    .forEach((button) => mediaObserver.observe(button));
}

async function loadMediaCard(button, { automatic = false } = {}) {
  if (!button || button.dataset.loading === "true") return;
  button.dataset.loading = "true";
  button.disabled = true;
  button.classList.remove("error");
  const subtitle = button.querySelector(".media-copy small");
  if (subtitle) subtitle.textContent = automatic ? "正在加载缩图…" : "正在读取…";

  try {
    const fileName = button.dataset.mediaFile || "";
    const requestedKind = button.dataset.mediaKind || "";
    const direction = button.dataset.mediaDirection || "inbound";
    const messageId = button.dataset.mediaId || "";
    const data = fileName
      ? { available:true, kind:requestedKind, fileName }
      : await jget(
        `/api/inbox/media?instance=${encodeURIComponent(currentInstance)}`
        + `&phone=${encodeURIComponent(currentPhone)}`
        + `&messageId=${encodeURIComponent(messageId)}`
        + `&direction=${encodeURIComponent(direction)}`
      ).catch(() => null);
    if (!data?.available) throw new Error("这个媒体暂时无法读取");

    const kind = data.kind || requestedKind;
    const src = data.dataUrl || `/api/inbox/media/file?fileName=${encodeURIComponent(data.fileName || "")}`;
    const preview = document.createElement("div");
    preview.className = "media-preview";
    if (kind === "video") {
      const video = document.createElement("video");
      video.className = "message-video";
      video.src = src;
      video.controls = true;
      video.preload = "metadata";
      video.playsInline = true;
      preview.appendChild(video);
    } else if (kind === "document") {
      const link = document.createElement("a");
      link.className = "media-document";
      link.href = src;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "打开客户文件";
      preview.appendChild(link);
    } else {
      const image = document.createElement("img");
      image.className = "message-image";
      image.src = src;
      image.alt = kind === "sticker" ? "客户贴图" : "客户图片";
      image.loading = "lazy";
      image.addEventListener("click", () => openLightbox(src));
      preview.appendChild(image);
    }
    button.replaceWith(preview);
  } catch (error) {
    button.dataset.loading = "false";
    button.disabled = false;
    button.classList.add("error");
    if (subtitle) subtitle.textContent = `${error.message || "无法加载"} · 点击重试`;
  }
}

function resizeComposer(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = `${Math.min(textarea.scrollHeight, 130)}px`;
}

function wireComposer() {
  const textarea = $("composerText");
  const send = $("sendButton");
  const attach = $("attachButton");
  const file = $("imageFile");
  textarea.addEventListener("input", () => resizeComposer(textarea));
  textarea.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      doSend();
    }
  });
  send.addEventListener("click", doSend);
  attach.addEventListener("click", () => file.click());
  file.addEventListener("change", () => {
    const selected = file.files[0];
    if (!selected) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = { dataUrl:String(reader.result), name:selected.name };
      showImagePreview();
    };
    reader.readAsDataURL(selected);
    file.value = "";
  });
  $("imagePreviewClear").addEventListener("click", () => {
    pendingImage = null;
    $("imagePreview").classList.add("hidden");
  });
}

function showImagePreview() {
  if (!pendingImage || !$("imagePreview")) return;
  $("imagePreviewThumb").src = pendingImage.dataUrl;
  $("imagePreviewName").textContent = pendingImage.name;
  $("imagePreview").classList.remove("hidden");
}

async function doSend() {
  const textarea = $("composerText");
  const body = textarea.value.trim();
  if (!body && !pendingImage) return;
  if (newContactAwaitingFirstSend?.phone === currentPhone) {
    const preview = body || "[图片]";
    const confirmed = window.confirm(
      `确认使用 ${instanceLabel(currentInstance)} 发给新号码 ${currentPhone}？\n客户类型：${newContactAwaitingFirstSend.typeLabel}\n\n${preview.slice(0, 180)}`
    );
    if (!confirmed) return;
  }
  const send = $("sendButton");
  send.disabled = true;
  send.textContent = "发送中";
  try {
    if (pendingImage) {
      const response = await fetch("/api/inbox/send-image", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          instance:currentInstance,
          phone:currentPhone,
          image:pendingImage.dataUrl,
          caption:body,
        }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "发图失败");
      pendingImage = null;
      $("imagePreview")?.classList.add("hidden");
    } else {
      const response = await fetch("/api/inbox/send", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ instance:currentInstance, phone:currentPhone, text:body }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "发送失败");
    }
    textarea.value = "";
    if (newContactAwaitingFirstSend?.phone === currentPhone) newContactAwaitingFirstSend = null;
    resizeComposer(textarea);
    await openThread(currentPhone, { refresh:true });
    await loadThreads({ silent:true });
  } catch (error) {
    alert(error.message);
  } finally {
    send.disabled = false;
    send.textContent = "发送";
  }
}

function openLightbox(src) {
  let box = $("lightbox");
  if (!box) {
    box = document.createElement("div");
    box.id = "lightbox";
    box.className = "lightbox";
    box.innerHTML = "<img alt=''>";
    box.addEventListener("click", () => box.classList.add("hidden"));
    document.body.appendChild(box);
  }
  box.querySelector("img").src = src;
  box.classList.remove("hidden");
}

renderThreadEmpty();
loadInboxCapabilities().then(loadNumbers);
setInterval(async () => {
  if (!currentInstance) return;
  await loadThreads({ silent:true });
  if (currentPhone) await openThread(currentPhone, { refresh:true });
}, 15000);
</script>
