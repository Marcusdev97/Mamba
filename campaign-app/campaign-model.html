<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mamba Campaign Model</title>
  <style>
    :root{color-scheme:dark;--bg:#07110f;--panel:#0d1b18;--line:#203a34;--text:#edf8f4;--muted:#8eaaa1;--green:#45d99c;--red:#ff6b73}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07110f,#0b151b);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:27px}.sub,.status{color:var(--muted)}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.panel,.card{background:#0d1b18;border:1px solid var(--line);border-radius:13px}.panel{padding:17px;margin-top:14px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.wide{grid-column:1/-1}input,select,textarea{width:100%;background:#081411;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}.btn{border:1px solid var(--line);background:#10221e;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#052018;font-weight:700}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.card{padding:12px}.card span{display:block;color:var(--muted);font-size:11px}.card b{font-size:21px;display:block;margin-top:6px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #173029}th{color:var(--muted);font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#15342b;color:#8df0c5;font-size:11px}.row{cursor:pointer}.row:hover{background:#10221e}.hidden{display:none!important}.status{min-height:20px;margin:10px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:950px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:18px}}
  </style>
</head>
<body><main class="wrap">
  <div class="top"><div><h1>Campaign Planning</h1><div class="sub">Campaign ≠ Run. Plan members and steps first; execution remains in Campaign Center.</div></div><button class="btn" id="reload">Refresh</button></div>
  <div id="status" class="status"></div>
  <div class="grid">
    <section><div class="panel"><h3>Save Draft</h3><div class="form">
      <label><span>Name</span><input id="name" placeholder="August 2026 Old Lead Reactivation"></label>
      <label><span>Project Code</span><input id="projectId"></label>
      <label><span>Objective</span><select id="objective"><option>REACTIVATE_OLD_LEADS</option><option>LAUNCH_NEW_PROJECT</option><option>FOLLOW_UP_WARM_LEADS</option><option>INVITE_TO_SHOWROOM</option><option>RECOVER_MISSED_FOLLOW_UPS</option><option>PROMOTE_SPECIFIC_UNIT_TYPE</option><option>CALL_LIST_ONLY</option><option>MANUAL_FOLLOW_UP_ONLY</option></select></label>
      <label><span>Channel</span><select id="channel"><option>WHATSAPP</option><option>CALL</option><option>MANUAL</option></select></label>
      <label><span>Owner</span><input id="owner"></label><label><span>Attribution Window (days)</span><input id="window" type="number" min="1" max="365" value="30"></label>
      <label class="wide"><span>Steps — one Flow label per line</span><textarea id="steps" rows="6">Flow 1
Flow 2
Flow 3</textarea></label>
    </div><button class="btn primary" id="save" style="margin-top:12px">Save Draft</button></div>
    <div class="panel"><h3>Campaigns</h3><div id="campaignList"></div></div></section>
    <section><div id="detail" class="hidden"><div class="panel"><h2 id="title"></h2><div id="meta" class="sub"></div><div class="cards" id="metrics" style="margin-top:14px"></div></div><div class="panel"><h3>Steps</h3><div id="stepList"></div></div><div class="panel"><h3>Members</h3><div id="memberList"></div><div class="toolbar"><input id="memberKeys" placeholder="projectLeadKey, projectLeadKey" style="flex:1"><button class="btn" id="enroll">Enroll</button></div></div><div class="panel"><h3>Runs</h3><div id="runList"></div><div class="toolbar"><select id="runMode" style="max-width:120px"><option>TEST</option><option>LIVE</option></select><select id="runStep" style="max-width:220px"></select><button class="btn" id="createRun">Create Draft Run</button></div><div class="sub" style="margin-top:8px">Creating a Run here does not send messages. Launch remains in Campaign Center and rechecks eligibility.</div></div></div></section>
  </div>
</main><script src="/assets/mamba-shell.js"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let selected="";
async function api(url,options={}){const r=await fetch(url,{headers:{"content-type":"application/json"},...options}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||"Request failed");return d}function note(v,error=false){$("status").textContent=v;$("status").style.color=error?"var(--red)":"var(--muted)"}
async function load(){try{const d=await api("/api/campaign-model/campaigns");$("campaignList").innerHTML=d.campaigns.length?`<table><thead><tr><th>Name</th><th>Status</th><th>Members</th><th>Runs</th></tr></thead><tbody>${d.campaigns.map(c=>`<tr class="row" data-id="${esc(c.campaignId)}"><td>${esc(c.name)}<br><small>${esc(c.projectId)}</small></td><td><span class="pill">${esc(c.status)}</span></td><td>${c.memberCount}</td><td>${c.runCount}</td></tr>`).join("")}</tbody></table>`:`<div class="sub">No campaigns yet.</div>`;document.querySelectorAll("[data-id]").forEach(row=>row.onclick=()=>detail(row.dataset.id));note("Campaign model ready.")}catch(e){note(e.message,true)}}
async function detail(id){try{const d=await api(`/api/campaign-model/detail?campaignId=${encodeURIComponent(id)}`),c=d.campaign,m=d.metrics;selected=id;$("detail").classList.remove("hidden");$("title").textContent=c.name;$("meta").textContent=`${c.objective} · ${c.projectId} · ${c.channel} · ${c.status}`;const values={Members:m.members,Eligible:m.eligible,Sent:m.sent,Replied:m.replied,Warm:m.warm,Appointments:m.appointments,Bookings:m.bookings,SPA:m.spa,"Expected Commission":m.expectedCommission,"Actual Commission":m.actualCommission};$("metrics").innerHTML=Object.entries(values).map(([k,v])=>`<div class="card"><span>${k}</span><b>${v}</b></div>`).join("");$("stepList").innerHTML=c.steps.length?`<table>${c.steps.map(s=>`<tr><td>${s.stepOrder}</td><td>${esc(s.flowLabel)}</td><td>${esc(s.templateGroup||"-")}</td><td>${s.requiresHuman?"Human":"Automated"}</td></tr>`).join("")}</table>`:`<div class="sub">No steps.</div>`;$("runStep").innerHTML=`<option value="">No step</option>`+c.steps.map(s=>`<option value="${esc(s.campaignStepId)}">${s.stepOrder} · ${esc(s.flowLabel)}</option>`).join("");$("memberList").innerHTML=c.members.length?`<table><tr><th>Customer</th><th>Status</th><th>Joined</th></tr>${c.members.map(x=>`<tr><td>${esc(x.customerName||x.phone||x.customerId)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.joinedAt)}</td></tr>`).join("")}</table>`:`<div class="sub">No LIVE members enrolled.</div>`;$("runList").innerHTML=c.runs.length?`<table><tr><th>Run</th><th>Mode</th><th>Status</th><th>Started</th></tr>${c.runs.map(r=>`<tr><td>${esc(r.runId)}</td><td>${esc(r.mode)}</td><td><span class="pill">${esc(r.status)}</span></td><td>${esc(r.startedAt||"-")}</td></tr>`).join("")}</table>`:`<div class="sub">No runs.</div>`}catch(e){note(e.message,true)}}
$("save").onclick=async()=>{try{const steps=$("steps").value.split("\n").map(x=>x.trim()).filter(Boolean).map((flowLabel,i)=>({stepOrder:i+1,flowLabel,templateGroup:flowLabel}));const d=await api("/api/campaign-model/draft",{method:"POST",body:JSON.stringify({name:$("name").value,projectId:$("projectId").value,objective:$("objective").value,channel:$("channel").value,owner:$("owner").value,attributionWindowDays:$("window").value,steps})});await load();await detail(d.campaign.campaignId);note("Draft saved. No messages were sent.")}catch(e){note(e.message,true)}};
$("enroll").onclick=async()=>{if(!selected)return;try{const projectLeadIds=$("memberKeys").value.split(",").map(x=>x.trim()).filter(Boolean);await api("/api/campaign-model/members",{method:"POST",body:JSON.stringify({campaignId:selected,projectLeadIds})});await detail(selected);note("Campaign members enrolled.")}catch(e){note(e.message,true)}};
$("createRun").onclick=async()=>{if(!selected)return;try{await api("/api/campaign-model/runs",{method:"POST",body:JSON.stringify({campaignId:selected,stepId:$("runStep").value,mode:$("runMode").value,status:"DRAFT"})});await detail(selected);note("Draft Run created. Nothing was sent.")}catch(e){note(e.message,true)}};$("reload").onclick=load;load();
</script></body></html>
